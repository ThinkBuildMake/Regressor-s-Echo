<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regressor's Echo</title>
  <style>html, body { margin: 0; height: 100%; background: #111114; overflow: hidden; }</style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <!-- A fresh query string each visit, so browsers (and GitHub Pages' cache) never run old code. -->
  <script>for (const f of ['art', 'dialogue', 'audio', 'ui', 'game']) document.write(`<script src="${f}.js?v=${Date.now()}"><\/script>`);</script>
</body>
</html>
