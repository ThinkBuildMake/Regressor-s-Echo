<!doctype html>
<!-- Mechanic check: open this file in a browser. Prints RESULT OK or what failed. -->
<meta charset="utf-8">
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>window.SKIP_WARNING = true;</script>
<script src="../art.js"></script>
<script src="../dialogue.js"></script>
<script src="../game.js"></script>
<script>
const errors = [];
window.onerror = (m) => errors.push(m);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (done, timeout = 15000) => {
  for (let t = 0; t < timeout && !done(); t += 20) await wait(20);
};
const only = (new URLSearchParams(location.search).get('only') || '').toLowerCase().split(',').map((s) => s.trim()).filter(Boolean);
const matches = (name) => !only.length || only.some((part) => name.toLowerCase().includes(part));
const defaultRules = { ...rules };
const near = (a, b) => Math.abs(a - b) < 1.5;
const room = () => game.scene.getScene('room');
const O = () => room().rooms[room().index].rect; // current room's top-left in the world
// Restart into room i and wait until the new scene has really been built (a fixed wait is flaky).
// Wait until the respawn delay is over (game time runs slower than real time when frames are slow).
const alive = async () => { while (room().dead > 0) await wait(30); await wait(60); };
const go = async (i) => {
  const old = room().player;
  room().scene.restart({ index: i });
  while (!room().player || room().player === old || !room().player.body) await wait(50);
  await wait(100);
  return room();
};
const key = (type, keyCode) => {                     // synthetic key event Phaser will accept
  const e = new KeyboardEvent(type, { bubbles: true });
  Object.defineProperty(e, 'keyCode', { get: () => keyCode });
  window.dispatchEvent(e);
};
(async () => {
  const fails = [];
  const check = (ok, msg) => ok || fails.push(msg);
  while (!room()?.player) await wait(100);
  // Full runs have already seen this before the World 2/3 mechanic checks.
  if (only.length) Dialogue.seen.add('firstDeath');
  let s;
  // Walk the inserted chain in ROOMS order and compare every doorway row in world space.
  for (const [from, to] of [
    ['The gatehouse', 'Thornwood'], ['Thornwood', 'The moth'],
    ['Wrong order', 'Sawmill'], ['Sawmill', 'Three high'],
    ['Everything', 'Reliquary'], ['Reliquary', 'End of the greybox'],
  ]) {
    if (!matches(from) && !matches(to)) continue;
    const i = ROOMS.findIndex(([name]) => name === from);
    const j = ROOMS.findIndex(([name]) => name === to);
    const [, a, [ax, ay]] = ROOMS[i], [, b, [bx, by]] = ROOMS[j];
    const width = Math.max(30, ...a.map((row) => row.length));
    const opening = (rows, x, y) => rows.flatMap((row, r) =>
      row[x] !== undefined && row[x] !== '#' ? [y + r] : []);
    const exit = opening(a, width - 1, ay), entrance = opening(b, 0, by);
    check(j === i + 1 && ax + width === bx && exit.length >= 2 &&
      JSON.stringify(exit) === JSON.stringify(entrance), `${from} → ${to}: consecutive rooms with matching doorways`);
  }
  for (const [name, world] of [['Thornwood', 1], ['Sawmill', 2], ['Reliquary', 3]]) {
    if (!matches(name)) continue;
    check(ROOMS.find(([n]) => n === name)[3]?.world === world, `${name}: world ${world}`);
  }
  rules.freeze = false;                              // most checks below cover falling bodies
  if (matches(ROOMS[0][0])) {
    await go(0);
    await wait(300);
    s = room();
    const feet = s.player.y + 15;
    s.die();                                           // die on the start point
    await wait(600);
    await alive();
    const a = s.corpses[0];
    check(near(a.y + 16, feet) && a.x === s.start.x, `body rests on floor (${a.x},${a.y})`);
    check(s.player.y + 15 <= a.y - 16 + 1.5, `respawn lands on top of body (${s.player.y})`);
    s.die();                                           // player is now standing on body 1
    await wait(600);
    await alive();
    const b = s.corpses[1];
    check(near(b.y, a.y - 32) && b.x === a.x, `second body stacks (${b.x},${b.y})`);
    s.corpses.shift().destroy();                       // remove the base
    await until(() => near(b.y + 16, feet));
    check(near(b.y + 16, feet), `stack falls when base vanishes (${b.y})`);
  }

  if (matches(ROOMS[0][0])) {
    s = await go(0);                     // jump while pressed into a wall, standing on a body
    s.player.body.reset(O().x + 17 * 32 + 16, s.start.y); // column 17 touches the cliff face
    s.die();
    await wait(600);
    await alive();
    const standY = s.corpses[0].y - 31;                // standing on the body
    s.player.body.reset(O().x + 17 * 32 + 16, standY);
    await wait(200);
    key('keydown', 39);                                // hold →
    await wait(150);
    key('keydown', 32);                                // jump
    let top = s.player.y;
    for (let i = 0; i < 20; i++) { await wait(20); top = Math.min(top, s.player.y); }
    key('keyup', 32); key('keyup', 39);
    check(standY - top > 80, `full jump against wall (rose ${Math.round(standY - top)}px)`);
  }

  if (matches(ROOMS[2][0])) {
    s = await go(2);                     // plate room
    const plate = s.plates[0];
    s.player.body.reset(plate.x, plate.y - 12);
    await wait(400);
    check(!s.doors[0].body.enable, 'standing on plate opens door');
    s.die();
    await wait(600);
    await alive();
    check(!s.doors[0].body.enable, 'body on plate keeps door open');
  }

  if (matches(ROOMS[4][0])) {
    s = await go(4);                     // walker
    const e = s.enemies.find((en) => O().contains(en.x, en.y));
    const ex = O().x + 26 * 32 + 16;                   // under the right-hand hole
    e.body.reset(ex, e.y); e.dir = 1;
    s.player.body.reset(ex, O().y + 10 * 32 + 15);     // inside the hole, above the walker
    s.die();
    await wait(400);
    await alive();
    check(!s.enemies.includes(e), 'falling body crushes walker');
    s = await go(4);
    s.player.body.reset(s.enemies.find((e) => O().contains(e.x, e.y)).x - 40, O().y + 11 * 32 + 17); // in the tunnel, in its path
    await wait(1000);
    check(s.corpses.length === 1, 'walker kills on touch');
  }

  if (matches(ROOMS[5][0])) {
    s = await go(5);                     // boss
    const B = s.boss;
    s.player.body.reset(B.r.x + B.dir * 20, B.r.y - B.r.height / 2 - 16); // feet 1px above its top (a longer fall can sink past the stomp sliver in one slow frame)
    for (let t = 0; t < 2000 && B.hp === 3; t += 50) await wait(50);
    check(B.hp === 2, `stomp hurts boss (hp ${B.hp})`);
    s.die();
    check(B.hp === 3, 'dying heals boss');
    await wait(450);                                   // let the respawn delay pass
    s.player.body.reset(B.r.x, B.r.y + 40);           // under it, jump into its belly
    s.player.body.velocity.y = -400;
    await wait(300);
    check(s.corpses.length === 2, 'touching boss from below kills');
  }

  if (matches(ROOMS[6][0])) {
    s = await go(6);                     // slide room
    key('keydown', 39);                                // run right
    await wait(250);
    key('keydown', 83); await wait(50); key('keyup', 83); // S = slide
    await wait(50);
    check(s.lying && s.player.height === 14, 'S while running slides flat');
    key('keyup', 39);
    await wait(700);
    check(!s.lying && s.player.height === 30, 'stands back up after slide');
    s.player.body.reset(O().x + 13 * 32, O().y + 9 * 32); // over the middle of the spike pit
    s.setLying(true);
    s.die();
    await wait(600);
    await alive();
    const lb = s.corpses[0];
    check(lb.width === 62 && near(lb.y - lb.height / 2, O().y + 12 * 32), `lying body lands flush with the floor (top ${lb.y - lb.height / 2})`);
  }

  rules.freeze = true;                               // default: bodies float where you died
  if (matches(ROOMS[0][0])) {
    s = await go(0);
    s.player.body.reset(O().x + 10 * 32, O().y + 6 * 32); // mid-air
    s.die();
    const fy = s.corpses[0].y;
    await wait(500);
    check(s.corpses[0].y === fy, 'floating body stays where you died');
  }

  rules.freeze = true;
  if (matches(ROOMS.find(([n]) => n.startsWith('Forest 1'))[0])) {
    s = await go(ROOMS.findIndex((r) => r[0].startsWith('Forest 1')));            // forest 1 → forest 2 through the gap
    s.player.body.reset(O().x + 5 * 32, O().y + 10 * 32);
    s.die();                                           // leave a soul in forest 1
    await wait(450);
    await alive();
    const f1 = s.index;
    s.player.body.reset(O().right - 20, O().y + 15 * 32 + 17); // at the gap in the right wall
    key('keydown', 39);                                // walk right through it
    await wait(900);
    key('keyup', 39);
    check(s.index === f1 + 1 && !s.transit, `walking through the gap enters the next room (room ${s.index})`);
    check(s.corpses.length === 0, 'souls stay behind when you change rooms');
    check(near(s.cameras.main.scrollX, O().x), `camera slid to the new room (${Math.round(s.cameras.main.scrollX)} vs ${O().x})`);
  }

  if (matches(ROOMS.find(([n]) => n.startsWith('Walker'))[0])) {
    s = await go(ROOMS.findIndex(([n]) => n.startsWith('Walker')));  // walkers belong to their room
    const wi = s.index, home = s.walkerSpawns.find((w) => w.room === wi).x + 16;
    s.enemies[0].destroy(); s.enemies.length = 0;      // as if crushed
    s.enterRoom(0);
    check(s.enemies.length === 0, 'leaving a room removes its walkers');
    s.enterRoom(wi);
    check(s.enemies.length === 1 && s.enemies[0].x === home, 'coming back puts the walker where it started');
    await wait(600);
    check(s.enemies.every((e) => s.rooms[wi].rect.contains(e.x, e.y)), 'walker stays inside its room');
  }

  if (matches('The clearing')) {
    Dialogue.seen.delete('amulet'); NAMES.guide = '???';  // the amulet cutscene, skipped with Esc
    s = await go(ROOMS.findIndex(([n]) => n === 'The clearing'));
    Dialogue.skip(s);                                  // the clearing's opening lines
    await wait(100);
    const am = s.amulets[0];
    s.player.body.reset(am.x, am.y - 4);
    await wait(200);
    check(!s.guide.on && (s.talk.line || s.talk.queue.length), 'picking up the amulet starts the cutscene');
    key('keydown', 27); await wait(80); key('keyup', 27);
    await wait(1200);
    check(s.guide.on && s.wearing && NAMES.guide === 'Yourself' && !s.talk.line && !s.talk.queue.length,
      'Esc skips the cutscene, and the ghost still appears');
    await wait(2500);
    check(s.guide.alpha === 0, `the guide fades away after the conversation (alpha ${s.guide.alpha})`);
    Dialogue.seen.delete('thorns'); Dialogue.play(s, 'thorns');
    await wait(1000);
    check(s.guide.alpha > 0.3, `the guide comes back for his next conversation (alpha ${s.guide.alpha})`);
    Dialogue.skip(s);
  }

  if (matches('The chain')) {
    Dialogue.seen.add('chain');
    s = await go(ROOMS.findIndex(([n]) => n === 'The chain'));  // the way out of The chain is at the top right
    await alive();
    s.player.body.reset(O().right - 40, O().y + 9 * 32 + 17);
    key('keydown', 39); await wait(900); key('keyup', 39);
    check(s.rooms[s.index].name === 'The long pit', `top right of The chain leads to the long pit (${s.rooms[s.index].name})`);
  }

  if (matches('The moth')) {
    Dialogue.seen.delete('moth');                      // the moth: hidden until its intro brings it in
    s = await go(ROOMS.findIndex(([n]) => n === 'The moth'));
    check(s.boss?.hidden && !s.boss.r.visible, 'moth hidden before its intro');
    check(!s.talk.queue.length && !s.talk.line, 'no talking until you walk in');
    s.player.body.reset(O().x + 8 * 32, O().y + 9 * 32 + 17);
    await wait(200);
    check(s.talk.line || s.talk.queue.length, 'walking partway in starts the shaking');
    for (let i = 0; i < 6 && (s.talk.line || s.talk.queue.length); i++) { Dialogue.update(s, 0, true); Dialogue.update(s, 0, true); }
    for (let t = 0; t < 40 && s.boss?.hidden; t++) await wait(100); // bursts out, flies in, screams
    check(s.boss && !s.boss.hidden && s.boss.r.visible, 'moth arrives during the intro');
    check(!s.textures.exists('mothFly') || s.boss?.img?.active, 'the moth is painted once it arrives');
    const M = s.boss, mi = s.index;
    for (let n = 0; n < 8 && M.hp > 0; n++) { // stomp until it's beaten (a stomp during its hurt blink doesn't count)
      const hp = M.hp;
      s.player.body.reset(M.r.x + M.dir * 20, M.r.y - M.r.height / 2 - 16);
      for (let t = 0; t < 2000 && M.hp === hp; t += 50) await wait(50);
      await wait(700);
    }
    check(M.hidden && s.talk.queue.length > 0, 'the last stomp starts the moth ending scene');
    Dialogue.skip(s);                                  // skipping still dissolves it
    await wait(200);
    check(!s.boss && s.gates.every((g) => !g.active || g.room !== mi), `beating the moth opens the vines (hp ${M.hp})`);
    s.player.body.reset(s.rooms[mi].rect.right - 20, s.rooms[mi].rect.y + 15 * 32 + 17);
    key('keydown', 39); await wait(900); key('keyup', 39);
    check(s.rooms[s.index].name === 'Let go' && rules.max === 2, `walking on reaches World 2 with 2 souls (${s.rooms[s.index].name}, ${rules.max})`);
  }

  rules.freeze = true; // the real game: souls float
  // World 2: self-destruct is held. Letting go early cancels; holding long enough leaves a soul.
  if (matches('Let go')) {
    s = await go(ROOMS.findIndex(([n]) => n === 'Let go'));
    await wait(2500); await alive();
    key('keydown', 75); await wait(250); key('keyup', 75); await wait(100);
    check(s.corpses.length === 0 && s.charge === 0, `letting go of K early cancels (${s.corpses.length} souls)`);
    key('keydown', 75); await until(() => s.corpses.length === 1); key('keyup', 75);
    check(s.corpses.length === 1, `holding K leaves a soul (${s.corpses.length})`);
    const sb = s.corpses[0];
    check(sb && near((sb.y + sb.height / 2) % 32, 0), `souls snap to the tile grid vertically (bottom ${sb && sb.y + sb.height / 2})`);
  }

  // Lasers: walking into the beam kills you, and your soul then cuts the beam short.
  if (matches('The beam')) {
    s = await go(ROOMS.findIndex(([n]) => n === 'The beam'));
    await alive();
    const full = s.beams()[0].width;
    s.player.body.reset(s.lasers[0].e.x - 6 * 32, s.lasers[0].e.y + 2);
    await wait(300);
    check(s.corpses.length === 1, 'the laser kills you');
    check(s.beams()[0].width < full - 3 * 32, `your soul blocks the beam (${s.beams()[0].width} < ${full})`);
  }

  // Springs launch you far higher than a jump.
  if (matches('The spring')) {
    s = await go(ROOMS.findIndex(([n]) => n === 'The spring'));
    await alive();
    const sp = s.springs[0], y0 = sp.y;
    s.player.body.reset(sp.x, sp.y - 20);
    let high = Infinity;
    for (let i = 0; i < 40; i++) { await wait(25); high = Math.min(high, s.player.y); }
    check(y0 - high > 7 * 32, `the spring launches you about 9 tiles (${((y0 - high) / 32).toFixed(1)})`);
  }

  // World 3: recall takes back the newest soul first.
  if (matches('Three high')) {
    s = await go(ROOMS.findIndex(([n]) => n === 'Three high'));
    await alive();
    for (const tx of [5, 8, 11]) { s.player.body.reset(O().x + tx * 32 + 16, O().y + 15 * 32 + 17); await wait(50); s.die(); await alive(); }
    const xs = s.corpses.map((c) => c.x);
    key('keydown', 81); await wait(60); key('keyup', 81); await wait(100);
    check(s.corpses.length === 2 && s.corpses.every((c, i) => c.x === xs[i]), `tapping Q recalls only the newest soul (${s.corpses.length} left)`);
    key('keydown', 81); await wait(1200); key('keyup', 81);
    check(s.corpses.length === 0, `holding Q recalls the rest (${s.corpses.length} left)`);
  }

  // Solvability: put souls where the intended solution puts them, then make the real jumps.
  // place(tx, b): a soul with its feet b tiles above the floor at column tx. hop(): stand on a surface
  // `top` tiles up at column tx, jump while holding → (or ←); returns where you end up.
  const place = async (tx, b, floor = 16) => {
    const s = room(); s.player.body.reset(O().x + tx * 32 + 16, O().y + (floor - b) * 32 - 15.5); s.die(); await alive();
  };
  // Steers like a player: jump while holding →, let go of → once over the target column.
  const hop = async (tx, top, floor, toTx) => {
    const s = room(); s.player.body.reset(O().x + tx * 32 + 16, O().y + (floor - top) * 32 - 16); await wait(200);
    const goal = O().x + toTx * 32 + 16;
    key('keydown', 32); key('keydown', 39);
    let right = true, jump = true, brake = false;
    for (let t = 0; t < 1600; t += 10) {
      await wait(10);
      if (right && s.player.x >= goal - 4) { key('keyup', 39); right = false; key('keydown', 37); brake = true; } // tap ← to stop over it
      if (brake && s.player.body.velocity.x <= 0) { key('keyup', 37); brake = false; }
      if (jump && t >= 650) { key('keyup', 32); jump = false; }
    }
    if (right) key('keyup', 39);
    if (brake) key('keyup', 37);
    if (jump) key('keyup', 32);
    await wait(300);
    return { tx: Math.floor((s.player.x - O().x) / 32), x: (s.player.x - O().x) / 32, h: +(floor - (s.player.y + 15 - O().y) / 32).toFixed(2) };
  };
  const cleanSolveRoom = async (name) => {
    Object.assign(rules, defaultRules);
    stats.deaths = 0;
    // Movement replays run after the story, independent of which dialogue checks ran.
    Dialogue.seen.clear();
    Object.keys(SCRIPT).forEach((key) => Dialogue.seen.add(key));
    NAMES.guide = 'Yourself';
    room().input.keyboard.resetKeys();
    const s = await go(ROOMS.findIndex(([n]) => n === name));
    // A restart can cancel a doorway tween before its resume callback runs.
    s.physics.world.resume();
    await wait(200); await alive();
    check(!s.corpses.length && !s.talk.line && !s.talk.queue.length &&
      rules.max === (WORLD_SOULS[s.rooms[s.index].world] ?? defaultRules.max), `${name}: clean replay state`);
    return s;
  };
  const solve = async (name, souls, hops, floor = 16) => {
    if (!matches(name)) return;
    await cleanSolveRoom(name);
    for (const [tx, b] of souls) await place(tx, b, floor);
    const where = room().corpses.map((c) => `${Math.floor((c.x - O().x) / 32)}:${+(floor - (c.y + c.height / 2 - O().y) / 32).toFixed(2)}`).join(' ');
    for (const [tx, top, wantH, minTx] of hops) {
      const r = await hop(tx, top, floor, minTx);
      check(r.h >= wantH - 0.05 && r.h < wantH + 0.5 && r.x >= minTx - 0.4, `${name}: jump from ${top} up at column ${tx} reaches ${wantH} up (got ${r.h} up, column ${r.tx}; souls ${where})`);
    }
  };
  if (matches('The long pit')) {
    s = await cleanSolveRoom('The long pit');
    const slideTo = async (from, to, die = false) => {
      s.player.body.reset(O().x + from * 32 + 16, O().y + 10 * 32 - 16);
      await wait(100);
      const deaths = stats.deaths;
      key('keydown', 39);
      for (let t = 0; t < 2000 && s.player.body.velocity.x <= 100; t += 20) await wait(20);
      key('keydown', 83);
      for (let t = 0; t < 2000 && !s.lying; t += 20) await wait(20);
      key('keyup', 83);
      for (let t = 0; t < 4000 && stats.deaths === deaths &&
        s.player.x < O().x + to * 32; t += 20) await wait(20);
      key('keyup', 39);
      if (die) {
        await alive();
        check(stats.deaths === deaths + 1 && s.corpses[0]?.lying,
          'The long pit: sliding into the spikes leaves a flat bridge');
      } else {
        key('keydown', 37);
        for (let t = 0; t < 1000 && s.player.body.velocity.x > 0 && stats.deaths === deaths; t += 10) await wait(10);
        key('keyup', 37); await wait(500);
        check(stats.deaths === deaths && s.player.x >= O().x + (to - 0.4) * 32,
          `The long pit: slide from ${from} crosses the bridge (deaths ${stats.deaths - deaths}, column ${(s.player.x - O().x) / 32})`);
      }
    };
    // Stage A: die sliding, cross, then really jump onto the checkpoint step.
    await slideTo(5, 11, true);
    await slideTo(5, 11);
    const a = await hop(11, 0, 10, 12.5);
    check(a.h >= 0.95 && s.start === s.shrines.find((sh) => sh.x > O().x && sh.x < O().right)?.spawn,
      'The long pit: first bridge and hop reach the shrine');
    // Stage B: the bridge death revives the guard, so stomp it on both runs.
    const stompGuard = async () => {
      const guard = s.enemies.find((e) => O().contains(e.x, e.y));
      const deaths = stats.deaths;
      s.player.body.reset(O().x + 13 * 32 + 16, O().y + 9 * 32 - 16);
      await wait(150);
      key('keydown', 32); key('keydown', 39);
      for (let t = 0; t < 1800 && s.enemies.includes(guard) && stats.deaths === deaths; t += 10) {
        await wait(10);
        // Follow the patrol from above, then release steering after the stomp.
        const dx = guard.x - s.player.x;
        key(dx > 4 ? 'keydown' : 'keyup', 39);
        key(dx < -4 ? 'keydown' : 'keyup', 37);
      }
      key('keyup', 32); key('keyup', 39); key('keyup', 37);
      await wait(500);
      check(!s.enemies.includes(guard) && stats.deaths === deaths,
        'The long pit: jump from the shrine stomps the tunnel guard');
    };
    await stompGuard();
    await slideTo(17, 23, true);
    check(s.start.x > O().x + 12 * 32, 'The long pit: second death respawns at the shrine');
    check(s.enemies.some((e) => O().contains(e.x, e.y)),
      'The long pit: placing the bridge revives its guard');
    // Careless contact now moves the bridge out of the pit.
    const bridge = s.corpses[0], deathsBeforeGuard = stats.deaths;
    const guard = s.enemies.find((e) => O().contains(e.x, e.y));
    s.player.body.reset(guard.x, guard.y);
    await wait(150); await alive();
    check(stats.deaths === deathsBeforeGuard + 1 && s.corpses[0] !== bridge &&
      !s.corpses[0]?.lying && s.corpses[0].x < O().x + 18 * 32,
      'The long pit: touching the revived guard replaces the bridge with a standing soul');
    await stompGuard();
    await slideTo(17, 23, true);
    await stompGuard();
    await slideTo(17, 23);
    const b = await hop(23.3, 0, 10, 24);
    check(b.x >= 23.9 && b.h >= 0.95, 'The long pit: bridge reaches the exit post');
    const c = await hop(24, 1, 10, 28);
    check(c.x >= 28 && c.h >= 0.95, `The long pit: jump reaches the exit (column ${c.x}, height ${c.h})`);
    // The low ceiling prevents even a full jump from skipping an empty pit.
    s = await cleanSolveRoom('The long pit');
    const deaths = stats.deaths;
    await hop(5, 0, 10, 10);
    check(stats.deaths > deaths && s.player.x < O().x + 9 * 32,
      'The long pit: jumping without a bridge dies in the tunnel');
  }
  await solve('Let go', [[8, 0], [8, 1]], [[7, 0, 2, 8], [8, 2, 5, 9], [9, 5, 5, 11]]);
  if (matches('Let go')) {
    s = room();
    check(s.start === s.shrines.find((sh) => O().contains(sh.x, sh.y))?.spawn,
      'Let go: the safe stack reaches the shrine');
    const stomp = async () => {
      const guard = s.enemies.find((e) => O().contains(e.x, e.y));
      const deaths = stats.deaths;
      // Land on the low post, then jump onto the patrol.
      const post = await hop(13, 5, 16, 15);
      check(post.h >= 0.95, 'Let go: drop from the shrine onto the guard post');
      for (let t = 0; t < 7000 && guard.x > O().x + 17 * 32; t += 20) await wait(20);
      key('keydown', 32);
      for (let t = 0; t < 2500 && s.enemies.includes(guard) && stats.deaths === deaths; t += 10) {
        const dx = guard.x - s.player.x;
        const target = Phaser.Math.Clamp(dx * 5, -160, 160);
        const vx = s.player.body.velocity.x;
        key(vx < target - 12 ? 'keydown' : 'keyup', 39);
        key(vx > target + 12 ? 'keydown' : 'keyup', 37);
        await wait(10);
        if (t > 650) key('keyup', 32);
      }
      key('keyup', 32); key('keyup', 39); key('keyup', 37);
      await wait(300);
      check(!s.enemies.includes(guard) && stats.deaths === deaths,
        `Let go: jump from the shrine stomps the guard (deaths ${stats.deaths - deaths}, player ${(s.player.x-O().x)/32},${(s.player.y-O().y)/32}, guard ${(guard.x-O().x)/32},${(guard.y-O().y)/32})`);
    };
    await stomp();
    await place(21, 0);
    check(s.enemies.some((e) => O().contains(e.x, e.y)), 'Let go: placing the base revives the guard');
    await stomp();
    const base = await hop(20, 0, 16, 21);
    check(base.h >= 0.95, 'Let go: jump onto the plate soul');
    await place(21, 1);
    await stomp();
    const top = await hop(20, 0, 16, 21);
    const exit = await hop(21, 2, 16, 22);
    check(top.h >= 1.95 && exit.h >= 4.95,
      'Let go: two souls on the plate reach the exit ledge');
    const doors = s.doors.filter((d) => d.room === s.index);
    check(doors.every((d) => !d.body.enable), 'Let go: the bottom soul also opens the exit door');
    const through = await hop(22, 5, 16, 26);
    check(through.x >= 25.6 && through.h >= 4.95, 'Let go: jump through the held door');
    // A careless extra death removes the plate weight and revives the patrol.
    await place(16, 0);
    check(doors.every((d) => d.body.enable) && s.enemies.some((e) => O().contains(e.x, e.y)),
      'Let go: a third death erases the plate soul, shuts the door and revives the guard');
    s = await cleanSolveRoom('Let go');
    await place(8, 0);
    const short = await hop(8, 1, 16, 9);
    check(short.h < 4.9 && short.x < 9,
      'Let go: one soul falls short of the first ledge');
  }
  await solve('Off the edge', [[7, 0]], [[3, 0, 1, 7], [7, 1, 0, 11], [11, 0, 0, 13]], 8);
  if (matches('Off the edge')) {
    s = room();
    check(s.start === s.shrines.find((sh) => O().contains(sh.x, sh.y))?.spawn,
      'Off the edge: first airborne step reaches the shrine');
    await place(16, 0, 8);
    await place(21, 0, 8);
    const doors = s.doors.filter((d) => d.room === s.index);
    check(doors.every((d) => !d.body.enable), 'Off the edge: plate and airborne soul keep the exit open');
    const a = await hop(17, 0, 8, 21);
    const b = await hop(21, 1, 8, 25);
    const c = await hop(25, 0, 8, 27);
    check(a.h >= 0.95 && b.h >= -0.05 && b.x >= 24.6 && c.x >= 26.6,
      'Off the edge: second airborne step crosses the pit and held door');
    await place(14, 0, 8);
    check(doors.every((d) => d.body.enable) && s.start.x > O().x + 12 * 32,
      'Off the edge: careless third death erases the plate soul and respawns at the shrine');
    s = await cleanSolveRoom('Off the edge');
    const deaths = stats.deaths;
    await hop(3, 0, 8, 11);
    check(stats.deaths > deaths && s.player.x < O().x + 11 * 32,
      'Off the edge: the first pit cannot be jumped without an airborne soul');
    s = await cleanSolveRoom('Off the edge');
    s.player.body.reset(O().x + 2 * 32 + 16, O().y + 8 * 32 - 16);
    await wait(200);
    key('keydown', 75); key('keydown', 32); key('keydown', 39);
    await until(() => s.corpses.length === 1);
    key('keyup', 75); key('keyup', 32); key('keyup', 39);
    await alive();
    const soul = s.corpses[0];
    const tx = Math.floor((soul.x - O().x) / 32);
    const top = 8 - (soul.y - soul.height / 2 - O().y) / 32;
    check(tx >= 6 && tx <= 8 && top >= 1,
      `Off the edge: holding K through a running jump hangs a step (column ${tx}, top ${top})`);
    const onto = await hop(3, 0, 8, tx);
    const across = await hop(tx, top, 8, 11);
    check(onto.h >= top - 0.05 && across.x >= 10.6 && across.h >= -0.05,
      'Off the edge: the step made by a held jump really bridges the pit');
  }
  await solve('The ladder', [[8, 2], [9, 3]],
    [[7, 0, 3, 8], [8, 3, 4, 9], [9, 4, 7, 10], [10, 7, 7, 12]]);
  if (matches('The ladder')) {
    s = room();
    check(s.start === s.shrines.find((sh) => O().contains(sh.x, sh.y))?.spawn,
      'The ladder: the safe staircase reaches the shrine');
    // Stage two: the lower stair hangs over spikes instead of safe ground.
    await place(22, 2);
    await place(23, 3);
    const a = await hop(20, 0, 16, 22);
    const b = await hop(22, 3, 16, 23);
    const c = await hop(23, 4, 16, 24);
    check(a.h >= 2.95 && b.h >= 3.95 && c.h >= 6.95,
      'The ladder: airborne stairs bridge the spikes and climb the second ledge');
    await place(18, 0);
    const deaths = stats.deaths;
    await hop(20, 0, 16, 22);
    check(stats.deaths > deaths && s.start.x > O().x + 11 * 32,
      'The ladder: an extra death erases the bridge; the next approach falls into spikes and returns to the shrine');
  }
  await solve('The beam', [[9, 1], [10, 4]],
    [[8, 0, 2, 9], [9, 2, 5, 10], [10, 5, 8, 11], [11, 8, 8, 13]]);
  if (matches('The beam')) {
    s = room();
    check(s.start === s.shrines.find((sh) => O().contains(sh.x, sh.y))?.spawn,
      'The beam: shield staircase reaches the shrine');
    await place(23, 1);
    await place(24, 4);
    const a = await hop(22, 0, 16, 23);
    const b = await hop(23, 2, 16, 24);
    const c = await hop(24, 5, 16, 25);
    const doors = s.doors.filter((d) => d.room === s.index);
    check(a.h >= 1.95 && b.h >= 4.95 && c.h >= 7.95,
      'The beam: plate step and laser shield climb the second ledge');
    check(doors.every((d) => !d.body.enable), 'The beam: the lower step holds the exit open');
    const exit = await hop(25, 8, 16, 28);
    check(exit.x >= 27.6 && exit.h >= 7.95, 'The beam: cross the held exit door');
    await place(18, 0);
    check(doors.every((d) => d.body.enable), 'The beam: careless third death erases the plate weight and closes the exit');
    s = await cleanSolveRoom('The beam');
    await place(9, 1);
    const deaths = stats.deaths;
    await hop(9.7, 2, 16, 10);
    await alive();
    const shield = s.corpses[1];
    const shieldX = shield && Math.floor((shield.x - O().x) / 32);
    const shieldTop = shield && 16 - (shield.y - shield.height / 2 - O().y) / 32;
    check(stats.deaths === deaths + 1 && shieldX === 10 && shieldTop >= 5,
      `The beam: jumping beside the source makes the high shield (column ${shieldX}, top ${shieldTop})`);
    const onto = await hop(9, 2, 16, 10);
    const ledge = await hop(10, 5, 16, 11);
    check(onto.h >= 4.95 && ledge.h >= 7.95,
      'The beam: the soul made by the laser really reaches the ledge');
    s = await cleanSolveRoom('The beam');
    await place(8, 1);
    const short = await hop(8, 2, 16, 11);
    check(short.h < 7.9 && short.x < 11,
      'The beam: without the laser soul the first ledge is out of reach');
  }
  await solve('The spring', [[9, 6]], [[6, 0, 7, 9], [9, 7, 9, 11], [11, 9, 9, 13]]);
  if (matches('The spring')) {
    s = room();
    check(s.start === s.shrines.find((sh) => O().contains(sh.x, sh.y))?.spawn,
      'The spring: the first spring climb reaches the shrine');
    await place(23, 6);
    const launch = await hop(20, 0, 16, 23);
    const ledge = await hop(23, 7, 16, 25);
    const exit = await hop(25, 9, 16, 28);
    check(launch.h >= 6.95 && ledge.h >= 8.95 && exit.h >= 8.95,
      'The spring: the second landing soul shields the spring and reaches the exit');
    await place(17, 0);
    await place(18, 0);
    const deaths = stats.deaths;
    await hop(20, 0, 16, 23);
    await alive();
    check(stats.deaths > deaths,
      'The spring: extra deaths erase the high shield and the next launch hits the laser');
  }
  await solve('Wrong order', [[4, 0]], []);
  if (matches('Wrong order')) {
    s = room();
    const leftHop = async (tx, top, toTx) => {
      s.player.body.reset(O().x + tx * 32 + 16, O().y + (16 - top) * 32 - 16);
      await wait(200);
      key('keydown', 32); key('keydown', 37);
      await until(() => s.player.x <= O().x + toTx * 32 + 20);
      key('keyup', 37); key('keydown', 39);
      await until(() => s.player.body.velocity.x >= 0);
      key('keyup', 39); await wait(900); key('keyup', 32); await wait(200);
      return 16 - (s.player.y + 15 - O().y) / 32;
    };
    const shelf = await leftHop(4, 1, 3);
    check(shelf >= 3.95, 'Wrong order: the temporary step reaches the first plate shelf');
    await place(2, 4);
    await place(10, 0);
    const doors = s.doors.filter((d) => d.room === s.index);
    const a = await hop(6.4, 0, 16, 10);
    const b = await hop(10, 1, 16, 15);
    check(a.h >= 0.95 && b.x >= 14.6 && s.start === s.shrines.find((sh) => O().contains(sh.x, sh.y))?.spawn,
      'Wrong order: replace the approach step with the bridge and reach the shrine');
    await place(22, 6);
    const launch = await hop(20, 0, 16, 22);
    const high = await leftHop(22, 7, 18);
    check(launch.h >= 6.95 && high >= 8.95,
      `Wrong order: temporary spring landing reaches the nine-high plate (${JSON.stringify({launch, high})})`);
    await place(17, 9);
    await place(24, 6);
    const shield = await hop(20, 0, 16, 24);
    const exit = await hop(24, 7, 16, 28.5);
    check(shield.h >= 6.95 && exit.x >= 28 && doors.every((d) => !d.body.enable),
      `Wrong order: replace the temporary landing with the laser shield and cross to the held exit (${JSON.stringify({shield, exit, doors: doors.map(d => d.body.enable), deaths: stats.deaths})})`);
    await place(21, 0);
    check(doors.every((d) => d.body.enable),
      'Wrong order: an extra death erases the high plate and shuts the exit');
    s = await cleanSolveRoom('Wrong order');
    await place(10, 0); await place(4, 0); await place(2, 4);
    const deaths = stats.deaths;
    await hop(6.4, 0, 16, 10);
    check(stats.deaths > deaths,
      'Wrong order: pit first loses the bridge on the third death');
  }
  await solve('Three high', [[18, 2], [19, 3], [20, 4]], [[17, 0, 3, 18], [20, 5, 8, 21]]);
  // ...and the same rooms can't be skipped: one soul short, the last jump falls short.
  await solve('The ladder', [[9, 2]], []);
  if (matches('The ladder')) { const r = await hop(9, 3, 16, 10); check(r.h < 7, `The ladder: a stack 3 high can't reach the ledge (${r.h})`); }
  await solve('Three high', [[19, 2], [20, 3]], []);
  if (matches('Three high')) { const r = await hop(20, 4, 16, 22); check(r.h < 8, `Three high: two souls can't reach the ledge (${r.h})`); }
  if (matches('The spring')) { // the spring alone falls short of its ledge
    const s = await cleanSolveRoom('The spring');
    s.player.body.reset(s.springs[0].x, s.springs[0].y - 20); key('keydown', 39); await wait(1600); key('keyup', 39); await wait(300);
    const h = 16 - (s.player.y + 15 - O().y) / 32;
    check(h < 9, `The spring: the spring alone can't reach the ledge (${h.toFixed(2)} up)`);
  }

  for (let i = 0; i < ROOMS.length; i++) { if (!matches(ROOMS[i][0])) continue; room().scene.restart({ index: i }); await wait(300); }
  check(errors.length === 0, 'no errors: ' + errors.join('; '));
  document.body.insertAdjacentHTML('beforeend', `<pre>RESULT ${fails.length ? 'FAIL ' + fails.join(' | ') : 'OK'}</pre>`);
})().catch((e) => document.body.insertAdjacentHTML('beforeend', `<pre>RESULT FAIL crashed: ${e.stack}</pre>`));
</script>
