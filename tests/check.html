<!doctype html>
<!-- Mechanic check: open this file in a browser. Prints RESULT OK or what failed. -->
<meta charset="utf-8">
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script src="../art.js"></script>
<script src="../dialogue.js"></script>
<script src="../game.js"></script>
<script>
const errors = [];
window.onerror = (m) => errors.push(m);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const near = (a, b) => Math.abs(a - b) < 1.5;
const room = () => game.scene.getScene('room');
const O = () => room().rooms[room().index].rect; // current room's top-left in the world
// Restart into room i and wait until the new scene has really been built (a fixed wait is flaky).
// Wait until the respawn delay is over (game time runs slower than real time when frames are slow).
const alive = async () => { while (room().dead > 0) await wait(30); await wait(60); };
const go = async (i) => {
  const old = room().player;
  room().scene.restart({ index: i });
  while (!room().player || room().player === old || !room().player.body) await wait(50);
  await wait(100);
  return room();
};
const key = (type, keyCode) => {                     // synthetic key event Phaser will accept
  const e = new KeyboardEvent(type, { bubbles: true });
  Object.defineProperty(e, 'keyCode', { get: () => keyCode });
  window.dispatchEvent(e);
};
(async () => {
  const fails = [];
  const check = (ok, msg) => ok || fails.push(msg);
  while (!room()?.player) await wait(100);
  rules.freeze = false;                              // most checks below cover falling bodies
  await go(0);
  await wait(300);
  let s = room();
  const feet = s.player.y + 15;
  s.die();                                           // die on the start point
  await wait(600);
  await alive();
  const a = s.corpses[0];
  check(near(a.y + 16, feet) && a.x === s.start.x, `body rests on floor (${a.x},${a.y})`);
  check(s.player.y + 15 <= a.y - 16 + 1.5, `respawn lands on top of body (${s.player.y})`);
  s.die();                                           // player is now standing on body 1
  await wait(600);
  await alive();
  const b = s.corpses[1];
  check(near(b.y, a.y - 32) && b.x === a.x, `second body stacks (${b.x},${b.y})`);
  s.corpses.shift().destroy();                       // remove the base
  await wait(600);
  check(near(b.y + 16, feet), `stack falls when base vanishes (${b.y})`);

  s = await go(0);                     // jump while pressed into a wall, standing on a body
  s.player.body.reset(O().x + 17 * 32 + 16, s.start.y); // column 17 touches the cliff face
  s.die();
  await wait(600);
  await alive();
  const standY = s.corpses[0].y - 31;                // standing on the body
  s.player.body.reset(O().x + 17 * 32 + 16, standY);
  await wait(200);
  key('keydown', 39);                                // hold →
  await wait(150);
  key('keydown', 32);                                // jump
  let top = s.player.y;
  for (let i = 0; i < 20; i++) { await wait(20); top = Math.min(top, s.player.y); }
  key('keyup', 32); key('keyup', 39);
  check(standY - top > 80, `full jump against wall (rose ${Math.round(standY - top)}px)`);

  s = await go(2);                     // plate room
  const plate = s.plates[0];
  s.player.body.reset(plate.x, plate.y - 12);
  await wait(400);
  check(!s.doors[0].body.enable, 'standing on plate opens door');
  s.die();
  await wait(600);
  await alive();
  check(!s.doors[0].body.enable, 'body on plate keeps door open');

  s = await go(4);                     // walker
  const e = s.enemies.find((en) => O().contains(en.x, en.y));
  const ex = O().x + 26 * 32 + 16;                   // under the right-hand hole
  e.body.reset(ex, e.y); e.dir = 1;
  s.player.body.reset(ex, O().y + 10 * 32 + 15);     // inside the hole, above the walker
  s.die();
  await wait(400);
  await alive();
  check(!s.enemies.includes(e), 'falling body crushes walker');
  s = await go(4);
  s.player.body.reset(s.enemies.find((e) => O().contains(e.x, e.y)).x - 40, O().y + 11 * 32 + 17); // in the tunnel, in its path
  await wait(1000);
  check(s.corpses.length === 1, 'walker kills on touch');

  s = await go(5);                     // boss
  const B = s.boss;
  s.player.body.reset(B.r.x + B.dir * 20, B.r.y - 24 - 20); // just above its top
  await wait(400);
  check(B.hp === 2, `stomp hurts boss (hp ${B.hp})`);
  s.die();
  check(B.hp === 3, 'dying heals boss');
  await wait(450);                                   // let the respawn delay pass
  s.player.body.reset(B.r.x, B.r.y + 40);           // under it, jump into its belly
  s.player.body.velocity.y = -400;
  await wait(300);
  check(s.corpses.length === 2, 'touching boss from below kills');

  s = await go(6);                     // slide room
  key('keydown', 39);                                // run right
  await wait(250);
  key('keydown', 83); await wait(50); key('keyup', 83); // S = slide
  await wait(50);
  check(s.lying && s.player.height === 14, 'S while running slides flat');
  key('keyup', 39);
  await wait(700);
  check(!s.lying && s.player.height === 30, 'stands back up after slide');
  s.player.body.reset(O().x + 13 * 32, O().y + 9 * 32); // over the middle of the spike pit
  s.setLying(true);
  s.die();
  await wait(600);
  await alive();
  const lb = s.corpses[0];
  check(lb.width === 62 && near(lb.y - lb.height / 2, O().y + 12 * 32), `lying body lands flush with the floor (top ${lb.y - lb.height / 2})`);

  rules.freeze = true;                               // default: bodies float where you died
  s = await go(0);
  s.player.body.reset(O().x + 10 * 32, O().y + 6 * 32); // mid-air
  s.die();
  const fy = s.corpses[0].y;
  await wait(500);
  check(s.corpses[0].y === fy, 'floating body stays where you died');

  rules.freeze = true;
  s = await go(ROOMS.findIndex((r) => r[0].startsWith('Forest 1')));            // forest 1 → forest 2 through the gap
  s.player.body.reset(O().x + 5 * 32, O().y + 10 * 32);
  s.die();                                           // leave a soul in forest 1
  await wait(450);
  await alive();
  const f1 = s.index;
  s.player.body.reset(O().right - 20, O().y + 15 * 32 + 17); // at the gap in the right wall
  key('keydown', 39);                                // walk right through it
  await wait(900);
  key('keyup', 39);
  check(s.index === f1 + 1 && !s.transit, `walking through the gap enters the next room (room ${s.index})`);
  check(s.corpses.length === 0, 'souls stay behind when you change rooms');
  check(near(s.cameras.main.scrollX, O().x), `camera slid to the new room (${Math.round(s.cameras.main.scrollX)} vs ${O().x})`);

  s = await go(ROOMS.findIndex(([n]) => n.startsWith('Walker')));  // walkers belong to their room
  const wi = s.index, home = s.walkerSpawns.find((w) => w.room === wi).x + 16;
  s.enemies[0].destroy(); s.enemies.length = 0;      // as if crushed
  s.enterRoom(0);
  check(s.enemies.length === 0, 'leaving a room removes its walkers');
  s.enterRoom(wi);
  check(s.enemies.length === 1 && s.enemies[0].x === home, 'coming back puts the walker where it started');
  await wait(600);
  check(s.enemies.every((e) => s.rooms[wi].rect.contains(e.x, e.y)), 'walker stays inside its room');

  Dialogue.seen.add('chain');
  s = await go(ROOMS.findIndex(([n]) => n === 'The chain'));  // the way out of The chain is at the top right
  await alive();
  s.player.body.reset(O().right - 40, O().y + 9 * 32 + 17);
  key('keydown', 39); await wait(900); key('keyup', 39);
  check(s.rooms[s.index].name === 'The moth', `top right of The chain leads to the moth (${s.rooms[s.index].name})`);

  Dialogue.seen.delete('moth');                      // the moth: hidden until its intro drops it in
  s = await go(ROOMS.findIndex(([n]) => n === 'The moth'));
  check(s.boss?.hidden && !s.boss.r.visible, 'moth hidden before its intro');
  for (let i = 0; i < 6 && (s.talk.line || s.talk.queue.length); i++) { Dialogue.update(s, 0, true); Dialogue.update(s, 0, true); }
  await wait(1000);
  check(s.boss && !s.boss.hidden && s.boss.r.visible, 'moth arrives during the intro');
  const M = s.boss, mi = s.index;
  for (let n = 0; n < 3; n++) { s.player.body.reset(M.r.x + M.dir * 20, M.r.y - 44); await wait(600); }
  check(!s.boss && s.gates.every((g) => !g.active || g.room !== mi), `beating the moth opens the vines (hp ${M.hp})`);
  s.player.body.reset(s.rooms[mi].rect.right - 20, s.rooms[mi].rect.y + 15 * 32 + 17);
  key('keydown', 39); await wait(900); key('keyup', 39);
  check(s.rooms[s.index].name === 'Into the ruins' && rules.max === 2, `walking on reaches World 2 with 2 souls (${s.rooms[s.index].name}, ${rules.max})`);

  for (let i = 0; i < ROOMS.length; i++) { room().scene.restart({ index: i }); await wait(300); }
  check(errors.length === 0, 'no errors: ' + errors.join('; '));
  document.body.insertAdjacentHTML('beforeend', `<pre>RESULT ${fails.length ? 'FAIL ' + fails.join(' | ') : 'OK'}</pre>`);
})().catch((e) => document.body.insertAdjacentHTML('beforeend', `<pre>RESULT FAIL crashed: ${e.stack}</pre>`));
</script>
