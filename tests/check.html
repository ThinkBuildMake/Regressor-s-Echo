<!doctype html>
<!-- Mechanic check: open this file in a browser. Prints RESULT OK or what failed. -->
<meta charset="utf-8">
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>window.SKIP_WARNING = true;</script>
<script src="../art.js"></script>
<script src="../dialogue.js"></script>
<script src="../audio.js"></script>
<script src="../game.js"></script>
<script>
const errors = [];
window.onerror = (m) => errors.push(m);
const frameMS = 1000 / 60;
let frame = 0;
const nativeNow = performance.now.bind(performance);
let simulatedTime = nativeNow();
const epoch = Date.now() - simulatedTime;
performance.now = () => simulatedTime;
Date.now = () => epoch + simulatedTime;
const yieldBrowser = () => new Promise((resolve) => setTimeout(resolve, 0));
const stepped = new Promise((resolve) => {
  const stop = () => queueMicrotask(() => {
    game.loop.sleep();
    // Visibility changes must not restart the automatic loop or pause manual steps.
    for (const event of ['hidden', 'visible', 'blur', 'focus']) game.events.off(event);
    resolve();
  });
  if (game.isRunning) stop();
  else game.events.once(Phaser.Core.Events.READY, stop);
});
const advance = async () => {
  simulatedTime += frameMS;
  game.loop.now = simulatedTime;
  game.step(simulatedTime, frameMS);
  if (++frame % 120 === 0) await yieldBrowser();
};
const wait = async (ms) => {
  await stepped;
  for (let i = 0, frames = Math.round(ms / frameMS); i < frames; i++) await advance();
};
const until = async (done, timeout = 15000, message = 'replay condition') => {
  await stepped;
  const end = simulatedTime + timeout;
  while (!done() && simulatedTime < end) await advance();
  if (!done()) throw new Error(`Timed out waiting for ${message} (${room()?.rooms[room().index]?.name}, x=${((room().player.x - O().x) / 32).toFixed(2)}, feet=${((room().player.y + 15 - O().y) / 32).toFixed(2)}, dead=${room().dead}, transit=${room().transit}, dialogue=${!!room().talk.line})`);
};
const only = (new URLSearchParams(location.search).get('only') || '').toLowerCase().split(',').map((s) => s.trim()).filter(Boolean);
const matches = (name) => {
  const yes = !only.length || only.some((part) => name.toLowerCase().includes(part));
  if (yes) console.info('at ' + name); // run.mjs reports the last one if the run hangs
  return yes;
};
const defaultRules = { ...rules };
const near = (a, b) => Math.abs(a - b) < 1.5;
const room = () => game.scene.getScene('room');
const O = () => room().rooms[room().index].rect; // current room's top-left in the world
// Restart into room i and wait until the new scene has really been built (a fixed wait is flaky).
// Wait until the respawn delay is over in simulated time.
const alive = async () => { await until(() => room().dead <= 0, 8000, 'respawn'); await wait(60); };
const go = async (i) => { console.info('at go ' + ROOMS[i]?.[0]);
  const old = room().player;
  room().scene.restart({ index: i });
  // A restart may load art, which takes real time; keep stepping, but time out on the real clock.
  const ready = () => room().player && room().player !== old && room().player.body;
  for (const end = nativeNow() + 15000; !ready(); await new Promise((r) => setTimeout(r, 5))) {
    await advance();
    if (nativeNow() > end) throw new Error(`Timed out waiting for room restart (${ROOMS[i]?.[0]})`);
  }
  await wait(100);
  return room();
};
const key = (type, keyCode) => {                     // synthetic key event Phaser will accept
  const e = new KeyboardEvent(type, { bubbles: true });
  Object.defineProperty(e, 'keyCode', { get: () => keyCode });
  window.dispatchEvent(e);
};
(async () => {
  const fails = [];
  const check = (ok, msg) => { console.info('at after check: ' + msg); return ok || fails.push(msg); };
  while (!room()?.player) await wait(100);
  // Full runs have already seen this before the World 2/3 mechanic checks.
  if (only.length) Dialogue.seen.add('firstDeath');
  let s;
  const storyState = { stats: { ...stats }, rules: { ...rules }, seen: new Set(Dialogue.seen) };
  if (matches('The clearing audio')) {
    const play = GameAudio.play, calls = [], savedStats = { ...stats };
    GameAudio.play = (...args) => calls.push(args);
    try {
      s = await go(ROOMS.findIndex(r => r[0] === 'The clearing'));
      check(GameAudio.musicKey === 'world-1-forest-edge', 'world 1 music selected');
      const track = GameAudio.tracks.get(GameAudio.musicKey);
      GameAudio.room(s, 0);
      check(GameAudio.tracks.get(GameAudio.musicKey) === track, 'same world keeps its music instance');
      s.die();
      check(calls.some(([key]) => key === 'hero-death-burst'), 'death calls death sound');
      s = await go(ROOMS.findIndex(r => r[0] === 'The moth'));
      s.cue('moth'); GameAudio.room(s, 0);
      check(GameAudio.musicKey === 'boss-great-moth', 'boss arrival selects boss music');
      s.boss.hp = 0; GameAudio.room(s, 0);
      check(GameAudio.musicKey === 'world-1-forest-edge', 'fallen boss returns world music');
      s = await go(ROOMS.findIndex(r => r[0] === 'Let go'));
      check(GameAudio.musicKey === 'world-2-overgrown-ruins', 'world 2 music selected');
    } finally {
      GameAudio.play = play;
      Object.assign(stats, savedStats);
      Dialogue.seen = new Set(storyState.seen);
    }
  }

  // Story wiring: exercise room metadata and the event handlers, then suppress it for replays.
  for (const [name, sceneKey, trigger] of [
    ['Let go', 'letGo', (s) => Dialogue.play(s, s.rooms[s.index].enter)],
    ['Let go', 'chosenDeath', (s) => s.die(true)],
    ['The long pit', 'lowDoor', (s) => {
      s.player.body.reset(O().x + 7.5 * 32, O().y + 10 * 32 - 15); s.die();
    }],
    ['The ladder', 'carvings', (s) => {
      const spot = s.rooms[s.index].spots.find((sp) => sp[1] === 'carvings');
      if (spot) Dialogue.play(s, spot[1]);
    }],
    ['Three high', 'pyramid', (s) => {
      const spot = s.rooms[s.index].spots.find((sp) => sp[1] === 'pyramid');
      if (spot) Dialogue.play(s, spot[1]);
    }],
    ['Everything', 'almostCompetent', (s) => {
      const sh = s.shrines.find((sh) => s.rooms[s.index].rect.contains(sh.x, sh.y));
      s.player.body.reset(sh.x, sh.y); s.update(0, 16);
    }],
    ['The rehearsal', 'breakingBeam', (s) => {
      s.player.body.reset(O().x + 6 * 32, O().y + 15 * 32 - 15); s.die();
      const c = s.corpses.at(-1);
      s.player.body.reset(O().x + 3 * 32, O().y + 15 * 32 - 15);
      s.updateAimedBeam({ x: c.x + 64, y: c.y, angle: Math.PI, clock: 1 }, 0);
    }],
    ['The tree guardian', 'guideCrack', (s) => {
      const b = s.boss; b.hidden = false; b.hp = 1; b.hurt = 0;
      b.stompReady = true; b.open = 2;
      s.player.body.reset(b.r.x, b.r.y - b.r.height / 2 - 14);
      s.player.body.velocity.y = 10; s.bossPreviousFeet = b.r.y - b.r.height / 2;
      s.touchBoss();
    }],
  ]) {
    if (!matches(name)) continue;
    s = await go(ROOMS.findIndex(([n]) => n === name));
    Dialogue.skip(s); await alive();
    Dialogue.seen.delete(sceneKey);
    trigger(s);
    check(!!SCRIPT[sceneKey] && Dialogue.seen.has(sceneKey) &&
      s.talk.queue.length > 0, `${name}: ${sceneKey} exists and fires on its trigger`);
    check(!Dialogue.play(s, sceneKey), `${sceneKey} plays once`);
    Dialogue.skip(s);
  }
  Object.assign(stats, storyState.stats); Object.assign(rules, storyState.rules);
  Dialogue.seen = storyState.seen;
  for (const key of ['lowDoor', 'letGo', 'chosenDeath', 'carvings', 'guideCrack', 'pyramid', 'almostCompetent', 'breakingBeam']) Dialogue.seen.add(key);
  // Walk the inserted chain in ROOMS order and compare every doorway row in world space.
  for (const [from, to] of [
    ['The gatehouse', 'Thornwood'], ['Thornwood', 'The moth'],
    ['Off the edge', 'Take it back'], ['Take it back', 'The ladder'],
    ['Wrong order', 'Sawmill'], ['Sawmill', 'The tree guardian'], ['The tree guardian', 'Three high'],
    ['Everything', 'Reliquary'], ['Reliquary', 'The rehearsal'], ['The rehearsal', 'The old tree'], ['The old tree', 'The spectral stag'],
    ['The spectral stag', 'The pyramid entrance'],
  ]) {
    if (!matches(from) && !matches(to)) continue;
    const i = ROOMS.findIndex(([name]) => name === from);
    const j = ROOMS.findIndex(([name]) => name === to);
    const [, a, [ax, ay]] = ROOMS[i], [, b, [bx, by]] = ROOMS[j];
    const width = Math.max(30, ...a.map((row) => row.length));
    const opening = (rows, x, y) => rows.flatMap((row, r) =>
      row[x] !== undefined && row[x] !== '#' ? [y + r] : []);
    const exit = opening(a, width - 1, ay), entrance = opening(b, 0, by);
    check(j === i + 1 && ax + width === bx && exit.length >= 2 &&
      JSON.stringify(exit) === JSON.stringify(entrance), `${from} → ${to}: consecutive rooms with matching doorways`);
  }
  for (const [name, world] of [['Thornwood', 1], ['Sawmill', 2], ['Reliquary', 3]]) {
    if (!matches(name)) continue;
    check(ROOMS.find(([n]) => n === name)[3]?.world === world, `${name}: world ${world}`);
  }
  rules.freeze = false;                              // most checks below cover falling bodies
  if (matches(ROOMS[0][0])) {
    await go(0);
    await wait(300);
    s = room();
    const feet = s.player.y + 15;
    s.die();                                           // die on the start point
    await wait(600);
    await alive();
    const a = s.corpses[0];
    check(near(a.y + 16, feet) && a.x === s.start.x, `body rests on floor (${a.x},${a.y})`);
    check(s.player.y + 15 <= a.y - 16 + 1.5, `respawn lands on top of body (${s.player.y})`);
    s.die();                                           // player is now standing on body 1
    await wait(600);
    await alive();
    const b = s.corpses[1];
    check(near(b.y, a.y - 32) && b.x === a.x, `second body stacks (${b.x},${b.y})`);
    s.corpses.shift().destroy();                       // remove the base
    await until(() => near(b.y + 16, feet));
    check(near(b.y + 16, feet), `stack falls when base vanishes (${b.y})`);
  }

  if (matches(ROOMS[0][0])) {
    s = await go(0);                     // jump while pressed into a wall, standing on a body
    s.player.body.reset(O().x + 17 * 32 + 16, s.start.y); // column 17 touches the cliff face
    s.die();
    await wait(600);
    await alive();
    const standY = s.corpses[0].y - 31;                // standing on the body
    s.player.body.reset(O().x + 17 * 32 + 16, standY);
    await wait(200);
    key('keydown', 39);                                // hold →
    await wait(150);
    key('keydown', 32);                                // jump
    let top = s.player.y;
    for (let i = 0; i < 20; i++) { await wait(20); top = Math.min(top, s.player.y); }
    key('keyup', 32); key('keyup', 39);
    check(standY - top > 80, `full jump against wall (rose ${Math.round(standY - top)}px)`);
  }

  if (matches(ROOMS[2][0])) {
    s = await go(2);                     // plate room
    const plate = s.plates[0];
    s.player.body.reset(plate.x, plate.y - 12);
    await wait(400);
    check(!s.doors[0].body.enable, 'standing on plate opens door');
    s.die();
    await wait(600);
    await alive();
    check(!s.doors[0].body.enable, 'body on plate keeps door open');
  }

  if (matches(ROOMS[4][0])) {
    s = await go(4);                     // walker
    const e = s.enemies.find((en) => O().contains(en.x, en.y));
    const ex = O().x + 26 * 32 + 16;                   // under the right-hand hole
    e.body.reset(ex, e.y); e.dir = 1;
    s.player.body.reset(ex, O().y + 10 * 32 + 15);     // inside the hole, above the walker
    s.die();
    await wait(400);
    await alive();
    check(!s.enemies.includes(e), 'falling body crushes walker');
    s = await go(4);
    s.player.body.reset(s.enemies.find((e) => O().contains(e.x, e.y)).x - 40, O().y + 11 * 32 + 17); // in the tunnel, in its path
    await wait(1000);
    check(s.corpses.length === 1, 'walker kills on touch');
  }

  if (matches(ROOMS[5][0])) {
    s = await go(5);                     // boss
    const B = s.boss;
    s.player.body.reset(B.r.x + B.dir * 20, B.r.y - B.r.height / 2 - 16); // feet 1px above its top (a longer fall can sink past the stomp sliver in one slow frame)
    for (let t = 0; t < 2000 && B.hp === 3; t += 50) await wait(50);
    check(B.hp === 2, `stomp hurts boss (hp ${B.hp})`);
    s.die();
    check(B.hp === 3, 'dying heals boss');
    await wait(450);                                   // let the respawn delay pass
    s.player.body.reset(B.r.x, B.r.y + 40);           // under it, jump into its belly
    s.player.body.velocity.y = -400;
    await wait(300);
    check(s.corpses.length === 2, 'touching boss from below kills');
  }

  if (matches(ROOMS[6][0])) {
    s = await go(6);                     // slide room
    key('keydown', 39);                                // run right
    await wait(250);
    key('keydown', 83); await wait(50); key('keyup', 83); // S = slide
    await wait(50);
    check(s.lying && s.player.height === 14, 'S while running slides flat');
    key('keyup', 39);
    await wait(700);
    check(!s.lying && s.player.height === 30, 'stands back up after slide');
    s.player.body.reset(O().x + 13 * 32, O().y + 9 * 32); // over the middle of the spike pit
    s.setLying(true);
    s.die();
    await wait(600);
    await alive();
    const lb = s.corpses[0];
    check(lb.width === 62 && near(lb.y - lb.height / 2, O().y + 12 * 32), `lying body lands flush with the floor (top ${lb.y - lb.height / 2})`);
  }

  rules.freeze = true;                               // default: bodies float where you died
  if (matches(ROOMS[0][0])) {
    s = await go(0);
    s.player.body.reset(O().x + 10 * 32, O().y + 6 * 32); // mid-air
    s.die();
    const fy = s.corpses[0].y;
    await wait(500);
    check(s.corpses[0].y === fy, 'floating body stays where you died');
  }

  rules.freeze = true;
  if (matches(ROOMS.find(([n]) => n.startsWith('Forest 1'))[0])) {
    s = await go(ROOMS.findIndex((r) => r[0].startsWith('Forest 1')));            // forest 1 → forest 2 through the gap
    s.player.body.reset(O().x + 5 * 32, O().y + 10 * 32);
    s.die();                                           // leave a soul in forest 1
    await wait(450);
    await alive();
    const f1 = s.index;
    s.player.body.reset(O().right - 20, O().y + 15 * 32 + 17); // at the gap in the right wall
    key('keydown', 39);                                // walk right through it
    await wait(900);
    key('keyup', 39);
    check(s.index === f1 + 1 && !s.transit, `walking through the gap enters the next room (room ${s.index})`);
    check(s.corpses.length === 0, 'souls stay behind when you change rooms');
    check(near(s.cameras.main.scrollX, O().x), `camera slid to the new room (${Math.round(s.cameras.main.scrollX)} vs ${O().x})`);
  }

  if (matches(ROOMS.find(([n]) => n.startsWith('Walker'))[0])) {
    s = await go(ROOMS.findIndex(([n]) => n.startsWith('Walker')));  // walkers belong to their room
    const wi = s.index, home = s.walkerSpawns.find((w) => w.room === wi).x + 16;
    s.enemies[0].destroy(); s.enemies.length = 0;      // as if crushed
    s.enterRoom(0);
    check(s.enemies.length === 0, 'leaving a room removes its walkers');
    s.enterRoom(wi);
    check(s.enemies.length === 1 && s.enemies[0].x === home, 'coming back puts the walker where it started');
    await wait(600);
    check(s.enemies.every((e) => s.rooms[wi].rect.contains(e.x, e.y)), 'walker stays inside its room');
  }

  const stagingSeen = new Set(Dialogue.seen);
  // Replay staging with real physics, then replay the same scene with Esc.
  for (const [name, script, mark] of [
    ['The clearing', 'amulet', 11.5], ['First death', 'firstPit', 9],
    ['The moth', 'moth', 11], ['The old tree', 'stagNote', 19.5],
    ['The pyramid entrance', 'floorOne', 26],
  ]) if (matches(name)) {
    for (const skip of [false, true]) {
      Object.keys(SCRIPT).forEach((k) => Dialogue.seen.add(k));
      s = await go(ROOMS.findIndex(([n]) => n === name));
      Dialogue.skip(s); await alive();
      const originalCue = s.cue;
      // Keep the ending scene open long enough to inspect its final mark.
      s.cue = function (cue) { if (cue !== 'theEnd') originalCue.call(this, cue); };
      const start = Dialogue.mark(s, mark - 1);
      s.player.body.reset(start.x, start.y);
      Dialogue.seen.delete(script); Dialogue.play(s, script);
      key('keydown', 37);
      if (skip) { key('keydown', 27); await wait(40); key('keyup', 27); }
      else {
        for (let i = 0; i < 500 && s.talk.active; i++) {
          Dialogue.update(s, 0, true); await wait(50);
        }
      }
      key('keyup', 37);
      check(!s.talk.active && Math.abs(s.player.x - (O().x + mark * 32)) < 8,
        `${script}: ${skip ? 'Esc' : 'played'} ends at its mark`);
      check(s.player.body.blocked.down || s.player.body.touching.down,
        `${script}: returns on solid ground`);
      const x = s.player.x;
      key('keydown', 37); await wait(150); key('keyup', 37);
      check(s.player.x < x - 3, `${script}: player regains control`);
      s.cue = originalCue;
    }
  }

  Dialogue.seen = stagingSeen;

  if (matches('The clearing')) {
    Dialogue.seen.delete('amulet'); NAMES.guide = '???';  // the amulet cutscene, skipped with Esc
    s = await go(ROOMS.findIndex(([n]) => n === 'The clearing'));
    Dialogue.skip(s);                                  // the clearing's opening lines
    await wait(100);
    const am = s.amulets[0];
    s.player.body.reset(am.x, am.y - 4);
    await wait(200);
    check(!s.guide.on && (s.talk.line || s.talk.queue.length), 'picking up the amulet starts the cutscene');
    key('keydown', 27); await wait(80); key('keyup', 27);
    await wait(1200);
    check(s.guide.on && s.wearing && NAMES.guide === 'Yourself' && !s.talk.line && !s.talk.queue.length,
      'Esc skips the cutscene, and the ghost still appears');
    await wait(2500);
    check(s.guide.alpha === 0, `the guide fades away after the conversation (alpha ${s.guide.alpha})`);
    Dialogue.seen.delete('thorns'); Dialogue.play(s, 'thorns');
    await wait(1000);
    check(s.guide.alpha > 0.3, `the guide comes back for his next conversation (alpha ${s.guide.alpha})`);
    Dialogue.skip(s);
  }

  if (matches('The chain')) {
    Dialogue.seen.add('chain');
    s = await go(ROOMS.findIndex(([n]) => n === 'The chain'));  // the way out of The chain is at the top right
    await alive();
    s.player.body.reset(O().right - 40, O().y + 9 * 32 + 17);
    key('keydown', 39); await wait(900); key('keyup', 39);
    check(s.rooms[s.index].name === 'The long pit', `top right of The chain leads to the long pit (${s.rooms[s.index].name})`);
  }

  if (matches('The moth')) {
    Dialogue.seen.delete('moth');                      // the moth: hidden until its intro brings it in
    s = await go(ROOMS.findIndex(([n]) => n === 'The moth'));
    check(s.boss?.hidden && !s.boss.r.visible, 'moth hidden before its intro');
    check(!s.talk.queue.length && !s.talk.line, 'no talking until you walk in');
    key('keydown', 39);
    await until(() => s.talk.line || s.talk.queue.length, 3000);
    key('keyup', 39);
    check(s.talk.line || s.talk.queue.length, 'walking partway in starts the shaking');
    for (let i = 0; i < 50 && (s.talk.line || s.talk.queue.length); i++) { Dialogue.update(s, 0, true); await wait(100); }
    for (let t = 0; t < 40 && s.boss?.hidden; t++) await wait(100); // bursts out, flies in, screams
    check(s.boss && !s.boss.hidden && s.boss.r.visible, 'moth arrives during the intro');
    check(!s.textures.exists('mothFly') || s.boss?.img?.active, 'the moth is painted once it arrives');
    const M = s.boss, mi = s.index;
    check(s.gates.filter((g) => g.room === mi && g.x < O().x + T).every((g) => g.body.enable), 'moth: entrance closes during the fight');
    check(M.min - BOSS_W / 2 - O().x > 5.4 * T && O().right - M.max - BOSS_W / 2 > 5.4 * T, 'moth: neither wall kick reaches its back');
    const deaths = stats.deaths;
    // Walk into the thorns: this one soul is shield and launch step.
    key('keydown', 39);
    await until(() => stats.deaths > deaths, 2000);
    key('keyup', 39); Dialogue.skip(s); await alive(); Dialogue.skip(s);
    const soul = s.corpses[0];
    check(soul && stats.deaths === deaths + 1, 'one thorn death places the launch soul');
    // Reach the thorn soul with real inputs; combat uses only movement and jumps.
    key('keydown', 39); key('keydown', 83);
    await until(() => s.player.x >= soul.x - 90, 3000);
    key('keyup', 83); key('keyup', 39);
    await wait(120);
    const dust = new Set();
    const blockedDust = () => [...dust].some((sh) => !sh.active && Math.abs(sh.x - soul.x) < soul.width / 2 + 8 && Math.abs(sh.y - soul.y) < soul.height / 2 + 8);
    key('keydown', 32); key('keydown', 39);
    await until(() => s.player.x >= soul.x, 1500);
    key('keyup', 39); key('keyup', 32);
    s.player.body.setVelocityX(0);
    await until(() => s.player.body.blocked.down || s.dead > 0, 2000);
    check(Math.abs(s.player.x - soul.x) < 20 && s.player.y < soul.y - 25, `jump onto the thorn soul (${s.player.x-O().x},${s.player.y-O().y})`);
    const fightDeaths = stats.deaths;
    let lastHp = M.hp, bouncing = false, bounceCleared = false, plainBounce = false;
    const phases = new Set(), trace = [], loomCounts = new Set();
    let sideJump = false;
    const curtainColumns = new Set();
    for (let t = 0; t < 90000 && M.hp > 0 && stats.deaths === fightDeaths; t += 20) {
      if (trace.at(-1)?.phase !== M.phase) trace.push({phase:M.phase,hp:M.hp,x:((s.player.x-O().x)/T).toFixed(1),feet:((s.player.y+15-O().y)/T).toFixed(1)});
      phases.add(M.phase);
      if (M.phase === 'loomGap') loomCounts.add(M.fired);
      if (M.phase === 'stunned' && M.clock > 0.05) check(M.img?.angle === 25 || !M.img, 'moth: stunned wings visibly droop');
      const grounded = s.player.body.blocked.down || s.player.body.touching.down;
      let target = soul.x - 50;
      if (['diveTell', 'dive'].includes(M.phase)) target = M.r.x - BOSS_W / 2 - 40;
      if (M.phase === 'stunned') {
        target = M.r.x - BOSS_W / 2 - 28;
        if (grounded) key('keydown', 32);
        if (!sideJump || s.player.y + 15 < bounds(M.r).top) target = M.r.x;

    const a = await hop(10, 0, 8, 11);
    check(a.h >= 0.95 && s.start.x > O().x + 10 * 32, 'Take it back: jump to the shrine');
    await recall();
    await walkTo(16); await sacrifice();
    const plate = s.corpses[0], beforeBridge = stats.deaths;
    await walkTo(14); await jumpTo(18);
    key('keydown', 75); await wait(200);
    key('keydown', 39); await wait(180); key('keydown', 83);
    await until(() => stats.deaths > beforeBridge, 2500, 'slide bridge death');
    key('keyup', 75); key('keyup', 39); key('keyup', 83); await alive();
    check(s.corpses[0] === plate && s.corpses.at(-1).lying,
      'Take it back: real slide death preserves the plate and leaves a flat bridge');
    await walkTo(14); await jumpTo(18);
    const crossingDeaths = stats.deaths;
    key('keydown', 39); await wait(180); key('keydown', 83); await wait(60); key('keyup', 83);
    await until(() => s.rooms[s.index].name === 'The ladder' || stats.deaths > crossingDeaths, 5000, 'cross into The ladder');
    key('keyup', 39);
    check(s.rooms[s.index].name === 'The ladder' && stats.deaths === crossingDeaths,
      'Take it back: stage B slide reaches The ladder doorway without teleporting');
    s = await cleanSolveRoom('Take it back');
    check(!(await cross(1, 10)), 'Take it back: no-soul slide fails');
  }
  if (matches('Two places')) {
    s = await cleanSolveRoom('Two places');
    const trySlideGap = async () => {
      key('keydown', 39);
      await until(() => s.player.x >= O().x + 3.2 * 32, 1200, 'slide approach');
      key('keydown', 83); await wait(30); key('keydown', 32);
      const before = stats.deaths;
      for (let t = 0; t < 2500 && stats.deaths === before && s.player.x < O().x + 12 * 32; t += 20) await wait(20);
      key('keyup', 39); key('keyup', 83); key('keyup', 32); await alive();
      return stats.deaths > before || s.player.x < O().x + 12 * 32;
    };
    check(await trySlideGap(), 'Two places: a slide-jump cannot cross without swap');
    s = await cleanSolveRoom('Two places');
    const leaveGapSoul = async () => {
      key('keydown', 39);
      await until(() => s.player.x >= O().x + 4.1 * 32, 1200, 'run to gap lip');
      key('keydown', 32); await wait(350); key('keydown', 75);
      await until(() => s.dead > 0, 1600, 'mid-jump self-destruct');
      key('keyup', 39); key('keyup', 32); key('keyup', 75); await alive();
    };
    await leaveGapSoul();
    check(await trySlideGap(), 'Two places: the hanging soul cannot be crossed as a plain step');
    s = await cleanSolveRoom('Two places');
    await leaveGapSoul();
    const deaths = stats.deaths, soul = s.corpses.at(-1), gapPosition = [(s.corpses.at(-1).x-O().x)/32,(s.corpses.at(-1).y-O().y)/32];
    key('keydown', 39);
    await until(() => s.player.x >= O().x + 2.5 * 32, 1200, 'run before swap');
    key('keydown', 69); await wait(30); key('keyup', 69);
    check(stats.deaths === deaths && s.player.x > O().x + 8 * 32 && soul.x < O().x + 3 * 32,
      'Two places: E exchanges positions without a death');
    await until(() => s.player.x > O().x + 13.3 * 32 || stats.deaths > deaths, 2500, 'swap crossing');
    key('keyup', 39); await wait(100);
    check(stats.deaths === deaths && s.player.x > O().x + 11 * 32,
      `Two places: swap crossing (x=${(s.player.x-O().x)/32}, deaths=${stats.deaths-deaths})`);
    if (stats.deaths !== deaths || s.player.x < O().x + 12 * 32) throw new Error('Two places: swap crossing failed ' + JSON.stringify({soul:gapPosition,x:(s.player.x-O().x)/32,feet:(s.player.y+15-O().y)/32,deaths:stats.deaths-deaths}));
    const mountStep = async () => {
      key('keydown', 39);
      await until(() => s.player.x >= O().x + 14 * 32, 1200, 'approach stair');
      key('keydown', 32);
      await until(() => s.player.x >= O().x + 15.5 * 32, 1000, 'mount stair');
      key('keyup', 39); key('keyup', 32); key('keydown', 37);
      await until(() => s.player.body.velocity.x <= 0, 1000, 'brake on stair'); key('keyup', 37);
      await until(() => s.player.body.blocked.down, 1200, 'land on stair');
    };
    const approachPlate = async () => {
      await mountStep(); key('keydown', 39);
      key('keydown', 32);
      await until(() => s.player.x >= O().x + 18.3 * 32, 1000, 'jump to exit plate');
      key('keyup', 32); key('keyup', 39); key('keydown', 37);
      await until(() => s.player.body.velocity.x <= 0, 1000, 'brake on plate'); key('keyup', 37);
      await until(() => s.player.body.blocked.down, 1000, 'land under falling spike');
    };
    await approachPlate();
    const spikeDeaths = stats.deaths;
    await until(() => stats.deaths > spikeDeaths, 2000, 'spike leaves a plate soul'); await alive();
    key('keydown', 39); await wait(1500); key('keyup', 39);
    check(s.player.x < O().x + 16 * 32,
      'Two places: dying on the plate closes the approach behind it');
    key('keydown', 81); await wait(40); key('keyup', 81);
    // Leave a destination inside the approach gate, clear of the plate.
    await mountStep(); key('keydown', 39); key('keydown', 32);
    await until(() => s.player.x >= O().x + 20.5 * 32, 1500, 'jump over plate');
    key('keyup', 32); key('keyup', 39); key('keydown', 37);
    await until(() => s.player.body.velocity.x <= 0, 1000, 'brake at destination'); key('keyup', 37);
    await until(() => s.player.body.blocked.down, 1000, 'destination landing');
    key('keydown', 75);
    await until(() => s.dead > 0, 1200, 'leave escape soul'); key('keyup', 75); await alive();
    await approachPlate();
    key('keydown', 69); await wait(40); key('keyup', 69); await wait(150);
    check(s.player.x > O().x + 20 * 32 && s.doors.filter(d => d.room === s.index && d.x > O().x + 22 * 32).every(d => !d.body.enable),
      'Two places: swap leaves the plate held and reaches the exit side');
    const escapeDeaths = stats.deaths;
    await wait(1000);
    check(stats.deaths === escapeDeaths && s.droppers.find(d => d.room === s.index).state === 'gone',
      'Two places: the exchanged soul holds the plate and catches the falling spike');
    key('keydown', 39);
    await until(() => s.player.x > O().x + 28 * 32, 1500, 'walk to exit'); key('keyup', 39);

  }
  if (matches('Three jobs')) {
    s = await cleanSolveRoom('Three jobs');
    // Stage A: three separate jobs, then a real jump through the door to the shrine.
    for (const [x, b] of [[4, 0], [9, 0], [13, 2]]) await place(x, b, 8);
    check(s.doors.filter((d) => d.room === s.index).every((d) => d.body.enable === (d.x > O().x + 20 * 32)),
      'Three jobs: the first plate does not open the second stage');
    const aDeaths = stats.deaths;
    for (const [x, top, to, height] of [[5, 0, 9, 1], [9, 1, 13, 0], [13, 0, 16, -7]]) {
      const r = await hop(x, top, 8, to);
      check(r.x >= to - 0.4 && r.h >= height - 0.1,
        `Three jobs: stage A jump reaches ${to} (${r.x}, ${r.h})`);
    }
    check(stats.deaths === aDeaths && s.start.x > O().x + 15 * 32, 'Three jobs: stage A reaches the shrine alive');
    key('keydown', 81); await wait(1200); key('keyup', 81); await wait(100);
    // Stage B: leave the plate oldest, bridge the spikes, block the beam above the crumbling landing.
    for (const [x, b] of [[18, 0], [23, 0], [17, 0]]) await place(x, b, 15);
    const plate = s.corpses[0], bridge = s.corpses[1];
    key('keydown', 81); await wait(60); key('keyup', 81); await wait(100);
    await place(27, 2, 15);
    check(s.corpses[0] === plate && s.corpses[1] === bridge,
      'Three jobs: recalling a mistake preserves the plate and bridge');
    const bDeaths = stats.deaths;
    for (const [x, top, to, height] of [[19, 0, 23, 1], [23, 1, 29, -1]]) {
      const r = await hop(x, top, 15, to);
      check(r.x >= to - 0.4 && r.h >= height - 0.1,
        `Three jobs: stage B jump reaches ${to} (${r.x}, ${r.h})`);
    }
    check(stats.deaths === bDeaths, 'Three jobs: crumbling lips crossed without another death');
    await place(17, 0, 15);
    check(!s.corpses.includes(plate) && s.doors.filter((d) => d.room === s.index).every((d) => d.body.enable),
      'Three jobs: fourth death erases the plate and shuts both doors');
    s = await cleanSolveRoom('Three jobs');
    await place(4, 0, 8); await place(13, 2, 8);
    const deaths = stats.deaths;
    await hop(5, 0, 8, 13);
    check(stats.deaths > deaths, 'Three jobs: plate and laser blocker cannot replace the pit bridge');
  }
  if (matches('Everything')) {
    s = await cleanSolveRoom('Everything');
    const run = async (from, to, slide = false) => {
      s.player.body.reset(O().x + from * 32 + 16, O().y + 20 * 32 - 16);
      await wait(100);
      const deaths = stats.deaths;
      key('keydown', 39); await wait(180);
      if (slide) { key('keydown', 83); await wait(60); key('keyup', 83); }
      for (let t = 0; t < 3000 && stats.deaths === deaths && s.player.x < O().x + to * 32; t += 10) await wait(10);
      key('keyup', 39); key('keydown', 37);
      for (let t = 0; t < 500 && s.player.body.velocity.x > 0; t += 10) await wait(10);
      key('keyup', 37); await alive();
      return stats.deaths === deaths && s.player.x >= O().x + to * 32;
    };
    const recall = async () => {
      key('keydown', 81); await wait(60); key('keyup', 81); await wait(100);
    };
    // A real slide death places the bridge; the next slide and jump reach the shrine.
    await run(4, 14, true);
    check(s.corpses.at(-1)?.lying, 'Everything: slide death leaves a flat tunnel bridge');
    check(await run(4, 14, true), 'Everything: slide crosses the bridge');
    const a = await hop(14, 0, 20, 16);
    check(a.h >= 0.95 && s.start.x > O().x + 15 * 32,
      'Everything: jump reaches the shrine');
    await recall();
    // All three slots have different jobs. Undo the bad spring step without a fourth death.
    await place(19, 0, 20); await place(25, 0, 20); await place(37, 0, 20);
    const plate = s.corpses[0], jam = s.corpses[1];
    await recall(); await place(37, 6, 20);
    check(s.corpses[0] === plate && s.corpses[1] === jam,
      'Everything: recall repairs the spring step without losing plate or saw jam');
    await wait(1000);
    check(s.saws.some((sw) => sw.room === s.index && sw.jam), 'Everything: second soul jams the tunnel saw');
    const deaths = stats.deaths;
    for (const [x, top, to, height] of [[17, 0, 21, 0], [21, 0, 22, 1], [24, 0, 25, 1], [25, 1, 31, 0]]) {
      const r = await hop(x, top, 20, to);
      check(r.x >= to - 0.4 && r.h >= height - 0.1,
        `Everything: plate and saw passage reaches ${to} (${r.x}, ${r.h})`);
    }
    // Launch from the spring, steer onto the hanging soul, then jump to the ledge.
    const launch = await hop(34, 0, 20, 37);
    check(launch.h >= 6.95 && launch.x >= 36.6,
      `Everything: spring lands on the hanging step (${launch.x}, ${launch.h})`);
    const exit = await hop(37, 7, 20, 41);
    check(exit.h >= 8.95 && exit.x >= 40.6 && stats.deaths === deaths,
      `Everything: spring step reaches the nine-high exit (${exit.x}, ${exit.h})`);
    await place(32, 0, 20);
    check(!s.corpses.includes(plate) && s.doors.filter((d) => d.room === s.index).every((d) => d.body.enable),
      'Everything: careless fourth death erases the plate and closes the door');
    s = await cleanSolveRoom('Everything');
    const before = stats.deaths;
    await hop(5, 0, 20, 11);
    check(stats.deaths > before, 'Everything: jumping cannot skip the empty tunnel bridge');
  }
  await solve('Three high', [[7, 2], [8, 5], [9, 8]],
    [[6, 0, 3, 7], [7, 3, 6, 8], [8, 6, 9, 9], [9, 9, 10, 12]]);
  if (matches('Three high')) {
    s = room();
    check(s.start.x > O().x + 10 * 32, 'Three high: safe staircase reaches the shrine');
    // New staircase: the last death in the beam makes both a step and a shield.
    for (const [tx, b] of [[18, 3], [24, 2], [26, 5]]) await place(tx, b);
    check(s.beams()[0].height < 64, 'Three high: hanging shield blocks the laser under the lintel');
    const deaths = stats.deaths;
    key('keydown', 39);
    await until(() => s.player.x >= O().x + 23 * 32 || stats.deaths > deaths, 6000, 'drop from shrine through shielded passage');
    key('keyup', 39);
    check(stats.deaths === deaths && s.player.x >= O().x + 23 * 32, 'Three high: shrine route crosses under the shield');
    for (const [tx, top, to, height] of [[23, 0, 24, 3], [24, 3, 26, 6], [26, 6, 28, 8]]) {
      const r = await hop(tx, top, 16, to);
      check(r.h >= height - 0.05 && r.x >= to - 0.4,
        `Three high: laser staircase reaches ${height} up (got ${r.h}, column ${r.x})`);
    }
    const first = s.corpses[0];
    await place(17, 0);
    check(s.corpses.length === 3 && !s.corpses.includes(first),
      'Three high: careless fourth death erases the bottom step');
    const exposedDeaths = stats.deaths;
    await hop(15, 0, 16, 22);
    check(stats.deaths > exposedDeaths, 'Three high: erased shield leaves the low passage lethal');
  }
  // ...and the same rooms can't be skipped: one soul short, the last jump falls short.
  await solve('The ladder', [[9, 2]], []);
  if (matches('The ladder')) { const r = await hop(9, 3, 16, 10); check(r.h < 7, `The ladder: a stack 3 high can't reach the ledge (${r.h})`); }
  await solve('Three high', [[8, 2], [9, 5]], []);
  if (matches('Three high')) { const r = await hop(9, 6, 16, 12); check(r.h < 10, `Three high: two souls can't reach the ledge (${r.h})`); }
  if (matches('The spring')) { // the spring alone falls short of its ledge
    const s = await cleanSolveRoom('The spring');
    s.player.body.reset(s.springs[0].x, s.springs[0].y - 20); key('keydown', 39); await wait(1600); key('keyup', 39); await wait(300);
    const h = 16 - (s.player.y + 15 - O().y) / 32;
    check(h < 9, `The spring: the spring alone can't reach the ledge (${h.toFixed(2)} up)`);
  }

  for (let i = 0; i < ROOMS.length; i++) { if (!matches(ROOMS[i][0])) continue; room().scene.restart({ index: i }); await wait(300); }
  check(errors.length === 0, 'no errors: ' + errors.join('; '));
  document.body.insertAdjacentHTML('beforeend', `<pre>RESULT ${fails.length ? 'FAIL ' + fails.join(' | ') : 'OK'}</pre>`);
})().catch((e) => document.body.insertAdjacentHTML('beforeend', `<pre>RESULT FAIL crashed: ${e.stack}</pre>`));
</script>
