<!doctype html>
<!-- Mechanic check: open this file in a browser. Prints RESULT OK or what failed. -->
<meta charset="utf-8">
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>window.SKIP_WARNING = true;</script>
<script src="../art.js"></script>
<script src="../dialogue.js"></script>
<script src="../game.js"></script>
<script>
const errors = [];
window.onerror = (m) => errors.push(m);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (done, timeout = 15000, message = 'replay condition') => {
  const end = performance.now() + timeout;
  while (!done() && performance.now() < end) await wait(20);
  if (!done()) throw new Error(`Timed out waiting for ${message} (${room()?.rooms[room().index]?.name}, x=${((room().player.x - O().x) / 32).toFixed(2)}, feet=${((room().player.y + 15 - O().y) / 32).toFixed(2)}, dead=${room().dead}, transit=${room().transit}, dialogue=${!!room().talk.line})`);
};
const only = (new URLSearchParams(location.search).get('only') || '').toLowerCase().split(',').map((s) => s.trim()).filter(Boolean);
const matches = (name) => {
  const yes = !only.length || only.some((part) => name.toLowerCase().includes(part));
  if (yes) console.info('at ' + name); // run.mjs reports the last one if the run hangs
  return yes;
};
const defaultRules = { ...rules };
const near = (a, b) => Math.abs(a - b) < 1.5;
const room = () => game.scene.getScene('room');
const O = () => room().rooms[room().index].rect; // current room's top-left in the world
// Restart into room i and wait until the new scene has really been built (a fixed wait is flaky).
// Wait until the respawn delay is over (game time runs slower than real time when frames are slow).
const alive = async () => { await until(() => room().dead <= 0, 8000, 'respawn'); await wait(60); };
const go = async (i) => { console.info('at go ' + ROOMS[i]?.[0]);
  const old = room().player;
  room().scene.restart({ index: i });
  await until(() => room().player && room().player !== old && room().player.body, 5000, 'room restart');
  await wait(100);
  return room();
};
const key = (type, keyCode) => {                     // synthetic key event Phaser will accept
  const e = new KeyboardEvent(type, { bubbles: true });
  Object.defineProperty(e, 'keyCode', { get: () => keyCode });
  window.dispatchEvent(e);
};
(async () => {
  const fails = [];
  const check = (ok, msg) => { console.info('at after check: ' + msg); return ok || fails.push(msg); };
  while (!room()?.player) await wait(100);
  // Full runs have already seen this before the World 2/3 mechanic checks.
  if (only.length) Dialogue.seen.add('firstDeath');
  let s;
  // Walk the inserted chain in ROOMS order and compare every doorway row in world space.
  for (const [from, to] of [
    ['The gatehouse', 'Thornwood'], ['Thornwood', 'The moth'],
    ['Wrong order', 'Sawmill'], ['Sawmill', 'The tree guardian'], ['The tree guardian', 'Three high'],
    ['Everything', 'Reliquary'], ['Reliquary', 'The rehearsal'], ['The rehearsal', 'The old tree'], ['The old tree', 'The spectral stag'],
    ['The spectral stag', 'The pyramid entrance'],
  ]) {
    if (!matches(from) && !matches(to)) continue;
    const i = ROOMS.findIndex(([name]) => name === from);
    const j = ROOMS.findIndex(([name]) => name === to);
    const [, a, [ax, ay]] = ROOMS[i], [, b, [bx, by]] = ROOMS[j];
    const width = Math.max(30, ...a.map((row) => row.length));
    const opening = (rows, x, y) => rows.flatMap((row, r) =>
      row[x] !== undefined && row[x] !== '#' ? [y + r] : []);
    const exit = opening(a, width - 1, ay), entrance = opening(b, 0, by);
    check(j === i + 1 && ax + width === bx && exit.length >= 2 &&
      JSON.stringify(exit) === JSON.stringify(entrance), `${from} → ${to}: consecutive rooms with matching doorways`);
  }
  for (const [name, world] of [['Thornwood', 1], ['Sawmill', 2], ['Reliquary', 3]]) {
    if (!matches(name)) continue;
    check(ROOMS.find(([n]) => n === name)[3]?.world === world, `${name}: world ${world}`);
  }
  rules.freeze = false;                              // most checks below cover falling bodies
  if (matches(ROOMS[0][0])) {
    await go(0);
    await wait(300);
    s = room();
    const feet = s.player.y + 15;
    s.die();                                           // die on the start point
    await wait(600);
    await alive();
    const a = s.corpses[0];
    check(near(a.y + 16, feet) && a.x === s.start.x, `body rests on floor (${a.x},${a.y})`);
    check(s.player.y + 15 <= a.y - 16 + 1.5, `respawn lands on top of body (${s.player.y})`);
    s.die();                                           // player is now standing on body 1
    await wait(600);
    await alive();
    const b = s.corpses[1];
    check(near(b.y, a.y - 32) && b.x === a.x, `second body stacks (${b.x},${b.y})`);
    s.corpses.shift().destroy();                       // remove the base
    await until(() => near(b.y + 16, feet));
    check(near(b.y + 16, feet), `stack falls when base vanishes (${b.y})`);
  }

  if (matches(ROOMS[0][0])) {
    s = await go(0);                     // jump while pressed into a wall, standing on a body
    s.player.body.reset(O().x + 17 * 32 + 16, s.start.y); // column 17 touches the cliff face
    s.die();
    await wait(600);
    await alive();
    const standY = s.corpses[0].y - 31;                // standing on the body
    s.player.body.reset(O().x + 17 * 32 + 16, standY);
    await wait(200);
    key('keydown', 39);                                // hold →
    await wait(150);
    key('keydown', 32);                                // jump
    let top = s.player.y;
    for (let i = 0; i < 20; i++) { await wait(20); top = Math.min(top, s.player.y); }
    key('keyup', 32); key('keyup', 39);
    check(standY - top > 80, `full jump against wall (rose ${Math.round(standY - top)}px)`);
  }

  if (matches(ROOMS[2][0])) {
    s = await go(2);                     // plate room
    const plate = s.plates[0];
    s.player.body.reset(plate.x, plate.y - 12);
    await wait(400);
    check(!s.doors[0].body.enable, 'standing on plate opens door');
    s.die();
    await wait(600);
    await alive();
    check(!s.doors[0].body.enable, 'body on plate keeps door open');
  }

  if (matches(ROOMS[4][0])) {
    s = await go(4);                     // walker
    const e = s.enemies.find((en) => O().contains(en.x, en.y));
    const ex = O().x + 26 * 32 + 16;                   // under the right-hand hole
    e.body.reset(ex, e.y); e.dir = 1;
    s.player.body.reset(ex, O().y + 10 * 32 + 15);     // inside the hole, above the walker
    s.die();
    await wait(400);
    await alive();
    check(!s.enemies.includes(e), 'falling body crushes walker');
    s = await go(4);
    s.player.body.reset(s.enemies.find((e) => O().contains(e.x, e.y)).x - 40, O().y + 11 * 32 + 17); // in the tunnel, in its path
    await wait(1000);
    check(s.corpses.length === 1, 'walker kills on touch');
  }

  if (matches(ROOMS[5][0])) {
    s = await go(5);                     // boss
    const B = s.boss;
    s.player.body.reset(B.r.x + B.dir * 20, B.r.y - B.r.height / 2 - 16); // feet 1px above its top (a longer fall can sink past the stomp sliver in one slow frame)
    for (let t = 0; t < 2000 && B.hp === 3; t += 50) await wait(50);
    check(B.hp === 2, `stomp hurts boss (hp ${B.hp})`);
    s.die();
    check(B.hp === 3, 'dying heals boss');
    await wait(450);                                   // let the respawn delay pass
    s.player.body.reset(B.r.x, B.r.y + 40);           // under it, jump into its belly
    s.player.body.velocity.y = -400;
    await wait(300);
    check(s.corpses.length === 2, 'touching boss from below kills');
  }

  if (matches(ROOMS[6][0])) {
    s = await go(6);                     // slide room
    key('keydown', 39);                                // run right
    await wait(250);
    key('keydown', 83); await wait(50); key('keyup', 83); // S = slide
    await wait(50);
    check(s.lying && s.player.height === 14, 'S while running slides flat');
    key('keyup', 39);
    await wait(700);
    check(!s.lying && s.player.height === 30, 'stands back up after slide');
    s.player.body.reset(O().x + 13 * 32, O().y + 9 * 32); // over the middle of the spike pit
    s.setLying(true);
    s.die();
    await wait(600);
    await alive();
    const lb = s.corpses[0];
    check(lb.width === 62 && near(lb.y - lb.height / 2, O().y + 12 * 32), `lying body lands flush with the floor (top ${lb.y - lb.height / 2})`);
  }

  rules.freeze = true;                               // default: bodies float where you died
  if (matches(ROOMS[0][0])) {
    s = await go(0);
    s.player.body.reset(O().x + 10 * 32, O().y + 6 * 32); // mid-air
    s.die();
    const fy = s.corpses[0].y;
    await wait(500);
    check(s.corpses[0].y === fy, 'floating body stays where you died');
  }

  rules.freeze = true;
  if (matches(ROOMS.find(([n]) => n.startsWith('Forest 1'))[0])) {
    s = await go(ROOMS.findIndex((r) => r[0].startsWith('Forest 1')));            // forest 1 → forest 2 through the gap
    s.player.body.reset(O().x + 5 * 32, O().y + 10 * 32);
    s.die();                                           // leave a soul in forest 1
    await wait(450);
    await alive();
    const f1 = s.index;
    s.player.body.reset(O().right - 20, O().y + 15 * 32 + 17); // at the gap in the right wall
    key('keydown', 39);                                // walk right through it
    await wait(900);
    key('keyup', 39);
    check(s.index === f1 + 1 && !s.transit, `walking through the gap enters the next room (room ${s.index})`);
    check(s.corpses.length === 0, 'souls stay behind when you change rooms');
    check(near(s.cameras.main.scrollX, O().x), `camera slid to the new room (${Math.round(s.cameras.main.scrollX)} vs ${O().x})`);
  }

  if (matches(ROOMS.find(([n]) => n.startsWith('Walker'))[0])) {
    s = await go(ROOMS.findIndex(([n]) => n.startsWith('Walker')));  // walkers belong to their room
    const wi = s.index, home = s.walkerSpawns.find((w) => w.room === wi).x + 16;
    s.enemies[0].destroy(); s.enemies.length = 0;      // as if crushed
    s.enterRoom(0);
    check(s.enemies.length === 0, 'leaving a room removes its walkers');
    s.enterRoom(wi);
    check(s.enemies.length === 1 && s.enemies[0].x === home, 'coming back puts the walker where it started');
    await wait(600);
    check(s.enemies.every((e) => s.rooms[wi].rect.contains(e.x, e.y)), 'walker stays inside its room');
  }

  if (matches('The clearing')) {
    Dialogue.seen.delete('amulet'); NAMES.guide = '???';  // the amulet cutscene, skipped with Esc
    s = await go(ROOMS.findIndex(([n]) => n === 'The clearing'));
    Dialogue.skip(s);                                  // the clearing's opening lines
    await wait(100);
    const am = s.amulets[0];
    s.player.body.reset(am.x, am.y - 4);
    await wait(200);
    check(!s.guide.on && (s.talk.line || s.talk.queue.length), 'picking up the amulet starts the cutscene');
    key('keydown', 27); await wait(80); key('keyup', 27);
    await wait(1200);
    check(s.guide.on && s.wearing && NAMES.guide === 'Yourself' && !s.talk.line && !s.talk.queue.length,
      'Esc skips the cutscene, and the ghost still appears');
    await wait(2500);
    check(s.guide.alpha === 0, `the guide fades away after the conversation (alpha ${s.guide.alpha})`);
    Dialogue.seen.delete('thorns'); Dialogue.play(s, 'thorns');
    await wait(1000);
    check(s.guide.alpha > 0.3, `the guide comes back for his next conversation (alpha ${s.guide.alpha})`);
    Dialogue.skip(s);
  }

  if (matches('The chain')) {
    Dialogue.seen.add('chain');
    s = await go(ROOMS.findIndex(([n]) => n === 'The chain'));  // the way out of The chain is at the top right
    await alive();
    s.player.body.reset(O().right - 40, O().y + 9 * 32 + 17);
    key('keydown', 39); await wait(900); key('keyup', 39);
    check(s.rooms[s.index].name === 'The long pit', `top right of The chain leads to the long pit (${s.rooms[s.index].name})`);
  }

  if (matches('The moth')) {
    Dialogue.seen.delete('moth');                      // the moth: hidden until its intro brings it in
    s = await go(ROOMS.findIndex(([n]) => n === 'The moth'));
    check(s.boss?.hidden && !s.boss.r.visible, 'moth hidden before its intro');
    check(!s.talk.queue.length && !s.talk.line, 'no talking until you walk in');
    key('keydown', 39);
    await until(() => s.talk.line || s.talk.queue.length, 3000);
    key('keyup', 39);
    check(s.talk.line || s.talk.queue.length, 'walking partway in starts the shaking');
    for (let i = 0; i < 6 && (s.talk.line || s.talk.queue.length); i++) { Dialogue.update(s, 0, true); Dialogue.update(s, 0, true); }
    for (let t = 0; t < 40 && s.boss?.hidden; t++) await wait(100); // bursts out, flies in, screams
    check(s.boss && !s.boss.hidden && s.boss.r.visible, 'moth arrives during the intro');
    check(!s.textures.exists('mothFly') || s.boss?.img?.active, 'the moth is painted once it arrives');
    const M = s.boss, mi = s.index;
    check(s.gates.filter((g) => g.room === mi && g.x < O().x + T).every((g) => g.body.enable), 'moth: entrance closes during the fight');
    check(M.min - BOSS_W / 2 - O().x > 5.4 * T && O().right - M.max - BOSS_W / 2 > 5.4 * T, 'moth: neither wall kick reaches its back');
    const deaths = stats.deaths;
    // Walk into the thorns: this one soul is shield and launch step.
    key('keydown', 39);
    await until(() => stats.deaths > deaths, 2000);
    key('keyup', 39); Dialogue.skip(s); await alive(); Dialogue.skip(s);
    const soul = s.corpses[0];
    check(soul && stats.deaths === deaths + 1, 'one thorn death places the launch soul');
    // Approach from the safe side, jump onto the soul, then time vertical jumps
    // for the moth's next crossing. No player or boss repositioning during combat.
    key('keydown', 39); key('keydown', 83);
    await until(() => s.player.x >= soul.x - 90, 3000);
    key('keyup', 83); key('keyup', 39);
    await wait(120);
    const dust = new Set();
    const blockedDust = () => [...dust].some((sh) => !sh.active && Math.abs(sh.x - soul.x) < soul.width / 2 + 8 && Math.abs(sh.y - soul.y) < soul.height / 2 + 8);
    key('keydown', 32); key('keydown', 39);
    await until(() => s.player.x >= soul.x, 1500);
    key('keyup', 39); key('keyup', 32);
    s.player.body.setVelocityX(0);
    await until(() => s.player.body.blocked.down || s.dead > 0, 2000);
    check(Math.abs(s.player.x - soul.x) < 20 && s.player.y < soul.y - 25, `jump onto the thorn soul (${s.player.x-O().x},${s.player.y-O().y})`);
    const fightDeaths = stats.deaths;
    let lastHp = M.hp, bouncing = false, bounceCleared = false;
    for (let t = 0; t < 45000 && M.hp > 0 && stats.deaths === fightDeaths; t += 20) {
      const grounded = s.player.body.blocked.down || s.player.body.touching.down;
      const speed = BOSS_SPEED + (3 - M.hp) * BOSS_SPEEDUP;
      const crossing = (soul.x - M.r.x) / (M.dir * speed);
      if (grounded && crossing > 0.25 + (BOSS_W / 2 + 12) / speed && crossing < 0.33 + (BOSS_W / 2 + 12) / speed) key('keydown', 32);
      else if (s.player.body.velocity.y >= 0) key('keyup', 32);
      s.shots.filter((sh) => sh.mothDust).forEach((sh) => dust.add(sh));
      await wait(20);
      if (M.hp < lastHp && M.hp > 0) bouncing = true;
      if (bouncing && s.player.body.velocity.y < 0 && s.player.y + 15 < bounds(M.r).top) bounceCleared = true;
      lastHp = M.hp;
    }
    key('keyup', 32);
    check(bounceCleared, 'moth: real stomp bounce clears the back and continues to the next stomp');
    check(stats.deaths === deaths + 1 && s.corpses[0] === soul, 'three stomps keep the same thorn soul without dying');
    // Probe dust at shield height independently of the stomp attack timer.
    const probe = Object.assign(s.add.circle(soul.x + 3 * T, soul.y, 6, 0xffdf63), { vx: -210, vy: 0, mothDust: true });
    s.shots.push(probe); dust.add(probe);
    await wait(600);
    check(blockedDust() && soul.active,
      'the thorn soul blocks yellow wing dust and survives');
    check(M.hidden && s.talk.queue.length > 0, 'the last stomp starts the moth ending scene');
    Dialogue.skip(s);                                  // skipping still dissolves it
    await wait(200);
    check(rules.max === 2 && rules.selfDestruct, 'absorption grants the second rune and self-destruct');
    check(!s.boss && s.gates.every((g) => !g.active || g.room !== mi), `beating the moth opens the vines (hp ${M.hp})`);
    key('keydown', 39);
    for (let t = 0; t < 8000 && s.rooms[s.index].name !== 'Let go'; t += 20) {
      if (s.player.body.blocked.down || s.player.body.touching.down) key('keydown', 32);
      else if (s.player.body.velocity.y >= 0) key('keyup', 32);
      await wait(20);
    }
    key('keyup', 32); key('keyup', 39);
    check(s.rooms[s.index].name === 'Let go' && rules.max === 2, `walking on reaches World 2 with 2 souls (${s.rooms[s.index].name}, ${rules.max})`);
  }

  rules.freeze = true; // the real game: souls float
  // World 2: self-destruct is held. Letting go early cancels; holding long enough leaves a soul.
  if (matches('Let go')) {
    s = await go(ROOMS.findIndex(([n]) => n === 'Let go'));
    await wait(2500); await alive();
    key('keydown', 75); await wait(250); key('keyup', 75); await wait(100);
    check(s.corpses.length === 0 && s.charge === 0, `letting go of K early cancels (${s.corpses.length} souls)`);
    key('keydown', 75); await until(() => s.corpses.length === 1); key('keyup', 75);
    check(s.corpses.length === 1, `holding K leaves a soul (${s.corpses.length})`);
    const sb = s.corpses[0];
    check(sb && near((sb.y + sb.height / 2) % 32, 0), `souls snap to the tile grid vertically (bottom ${sb && sb.y + sb.height / 2})`);
  }

  // Lasers: walking into the beam kills you, and your soul then cuts the beam short.
  if (matches('The beam')) {
    s = await go(ROOMS.findIndex(([n]) => n === 'The beam'));
    await alive();
    const full = s.beams()[0].width;
    s.player.body.reset(s.lasers[0].e.x - 6 * 32, s.lasers[0].e.y + 2);
    await wait(300);
    check(s.corpses.length === 1, 'the laser kills you');
    check(s.beams()[0].width < full - 3 * 32, `your soul blocks the beam (${s.beams()[0].width} < ${full})`);
  }

  // Springs launch you far higher than a jump.
  if (matches('The spring')) {
    s = await go(ROOMS.findIndex(([n]) => n === 'The spring'));
    await alive();
    const sp = s.springs[0], y0 = sp.y;
    s.player.body.reset(sp.x, sp.y - 20);
    let high = Infinity;
    for (let i = 0; i < 40; i++) { await wait(25); high = Math.min(high, s.player.y); }
    check(y0 - high > 7 * 32, `the spring launches you about 9 tiles (${((y0 - high) / 32).toFixed(1)})`);
  }

  // World 3: recall takes back the newest soul first.
  if (matches('Three high')) {
    s = await go(ROOMS.findIndex(([n]) => n === 'Three high'));
    await alive();
    for (const tx of [3, 5, 7]) { s.player.body.reset(O().x + tx * 32 + 16, O().y + 15 * 32 + 17); await wait(50); s.die(); await alive(); }
    const xs = s.corpses.map((c) => c.x);
    key('keydown', 81); await wait(60); key('keyup', 81); await wait(100);
    check(s.corpses.length === 2 && s.corpses.every((c, i) => c.x === xs[i]), `tapping Q recalls only the newest soul (${s.corpses.length} left)`);
    key('keydown', 81); await wait(1200); key('keyup', 81);
    check(s.corpses.length === 0, `holding Q recalls the rest (${s.corpses.length} left)`);
  }

  // Solvability: put souls where the intended solution puts them, then make the real jumps.
  // place(tx, b): a soul with its feet b tiles above the floor at column tx. hop(): stand on a surface
  // `top` tiles up at column tx, jump while holding → (or ←); returns where you end up.
  const place = async (tx, b, floor = 16) => {
    const s = room(); s.player.body.reset(O().x + tx * 32 + 16, O().y + (floor - b) * 32 - 15.5); s.die(); await alive();
  };
  // Steers like a player: jump while holding →, let go of → once over the target column.
  const hop = async (tx, top, floor, toTx) => {
    const s = room(); s.player.body.reset(O().x + tx * 32 + 16, O().y + (floor - top) * 32 - 16); await wait(200);
    const goal = O().x + toTx * 32 + 16;
    key('keydown', 32); key('keydown', 39);
    let right = true, jump = true, brake = false;
    for (let t = 0; t < 1600; t += 10) {
      await wait(10);
      if (right && s.player.x >= goal - 4) { key('keyup', 39); right = false; key('keydown', 37); brake = true; } // tap ← to stop over it
      if (brake && s.player.body.velocity.x <= 0) { key('keyup', 37); brake = false; }
      if (jump && t >= 650) { key('keyup', 32); jump = false; }
    }
    if (right) key('keyup', 39);
    if (brake) key('keyup', 37);
    if (jump) key('keyup', 32);
    await wait(300);
    return { tx: Math.floor((s.player.x - O().x) / 32), x: (s.player.x - O().x) / 32, h: +(floor - (s.player.y + 15 - O().y) / 32).toFixed(2) };
  };
  const cleanSolveRoom = async (name) => {
    Object.assign(rules, defaultRules);
    stats.deaths = 0;
    stats.treePower = false;
    // Movement replays run after the story, independent of which dialogue checks ran.
    Dialogue.seen.clear();
    Object.keys(SCRIPT).forEach((key) => Dialogue.seen.add(key));
    NAMES.guide = 'Yourself';
    room().input.keyboard.resetKeys();
    const s = await go(ROOMS.findIndex(([n]) => n === name));
    // A restart can cancel a doorway tween before its resume callback runs.
    s.physics.world.resume();
    await wait(200); await alive();
    check(!s.corpses.length && !s.talk.line && !s.talk.queue.length &&
      rules.max === (WORLD_SOULS[s.rooms[s.index].world] ?? defaultRules.max), `${name}: clean replay state`);
    return s;
  };
  if (matches('The tree guardian')) {
    stats.treePower = false;
    s = await cleanSolveRoom('The tree guardian');
    const floor = O().y + 16 * 32;
    await place(21, 0); await place(13, 0);
    const B = s.boss, step = s.corpses[0], decoy = s.corpses[1];
    let buriedAt, recoveredAt;
    const observeBurial = () => {
      if (decoy.buried > 0 && buriedAt === undefined) buriedAt = s.time.now;
      if (buriedAt !== undefined && decoy.buried === 0 && recoveredAt === undefined) recoveredAt = s.time.now;
    };
    s.events.on('update', observeBurial);

    s = await cleanSolveRoom('The old tree');
    Dialogue.seen.delete('stagPromise'); Dialogue.seen.delete('stagNote');
    key('keydown', 39);
    await until(() => Dialogue.seen.has('stagPromise'), 8000, 'promise by old tree');
    key('keyup', 39);
    check(s.rooms[s.index].name === 'The old tree' && !Dialogue.seen.has('stagNote') && !s.boss,
      'The old tree: promise in a calm room; no note before the fight');
    Dialogue.skip(s);
  }
  if (matches('The spectral stag') || matches('The pyramid entrance')) {
    s = await cleanSolveRoom('The spectral stag');
    const B = s.boss;
    Dialogue.seen.delete('stagDown');
    // Place the wall with real deaths, then lead shots from the platform's left end.
    for (const x of [4, 5, 6]) await place(x, 0, 12);
    B.hp = 2;
    key('keydown', 81); await wait(60); key('keyup', 81); await wait(100);
    check(B.hp === 2 && s.corpses.length === 2, 'The spectral stag: recall never heals');
    await place(6, 0, 12);
    const before = stats.deaths;
    s.player.body.reset(O().x + 2 * 32 + 16, O().y + 12 * 32 - 15);
    B.phase = 'windup'; B.clock = 0;
    B.wave = { x: O().right - 32, broken: 0 };
    await until(() => !B.wave, 5000, 'wave stopped at wall');
    check(s.corpses.length === 1 && stats.deaths === before, 'The spectral stag: wave breaks two souls and stops at the third');
    await place(6, 0, 12);
    s.player.body.reset(O().x + 2 * 32 + 16, O().y + 12 * 32 - 15);
    const thinDeaths = stats.deaths;
    B.wave = { x: O().right - 32, broken: 0 };
    s.stagWave(B, 3);
    check(stats.deaths === thinDeaths + 1, 'The spectral stag: a two-thick wall cannot stop the wave');
    await alive();
    // Rebuild between runs: death heals all previous damage.
    for (const c of s.corpses.splice(0)) c.destroy();
    for (const x of [4, 5, 6]) await place(x, 0, 12);
    check(B.hp === 3, 'The spectral stag: rebuilding heals to full');
    const deaths = stats.deaths;
    B.clock = 8;
    for (let hp = 3; hp > 0; hp--) {
      s.player.body.reset(O().x + 2 * 32 + 16, O().y + 12 * 32 - 15);
      await until(() => B.phase === 'dazed', 12000, 'charge daze');
      // Walk off the wall's top onto the dazed back.
      s.player.body.reset(O().x + 6 * 32 + 16, O().y + 11 * 32 - 15);
      await wait(100);
      key('keydown', 39);
      await until(() => s.player.x >= O().x + 7 * 32 + 14, 1200, 'drop over stag');
      key('keyup', 39); key('keyup', 32); s.player.body.velocity.x = 0;
      await until(() => B.hp < hp, 2000, 'stomp damage');
      check(B.hp === hp - 1, `The spectral stag: stomp after charge ${4 - hp} (hp ${B.hp}, phase ${B.phase}, deaths ${stats.deaths - deaths}, x ${s.player.x - O().x}, y ${s.player.y - O().y})`);
      if (hp > 1) {
        s.player.body.reset(O().x + 2 * 32 + 16, O().y + 12 * 32 - 15);
        await until(() => B.phase === 'beam', 4000, 'beam windup');
        key('keydown', 32);
        await until(() => B.beam?.clock >= 0.65, 2000, 'beam aim lock');
        key('keyup', 32);
        await until(() => B.phase !== 'beam', 9000, 'beam recovery');
      }
    }
    check(stats.deaths === deaths && s.corpses.length === 1, 'The spectral stag: lead beams away, survive the wave and win without dying');
    Dialogue.skip(s);
    check(!s.boss && s.stagFinished && !s.guide.on, 'The spectral stag: last stand removes guide and opens entrance');
    Dialogue.seen.delete('stagNote'); Dialogue.seen.delete('floorOne');
    // Walk the whole return route and onward; no room restart or position reset.
    const walkTo = async (name, column, direction, timeout) => {
      key('keydown', direction);
      await until(() => {
        // Hop over the platform and the surviving wall soul in either direction.
        if (!s.transit && s.rooms[s.index].name === 'The spectral stag' && s.player.x < O().x + 10 * 32 &&
          s.player.body.blocked.down) key('keydown', 32);
        else if (s.player.body.velocity.y >= 0) key('keyup', 32);
        return s.rooms[s.index].name === name && !s.transit &&
          (direction === 37 ? s.player.x < O().x + column * 32 : s.player.x > O().x + column * 32);
      }, timeout, `walk to ${name} column ${column}`);
      key('keyup', direction); key('keyup', 32); s.player.body.velocity.x = 0;
    };
    await walkTo('The old tree', 20, 37, 10000);
    await until(() => Dialogue.seen.has('stagNote'), 2000, 'note behind the old tree');
    check(s.stagWriting.visible && !s.guide.on, 'The spectral stag: return to the dirt note without the guide');
    Dialogue.skip(s);
    await walkTo('The pyramid entrance', 22, 39, 20000);
    await until(() => Dialogue.seen.has('floorOne'), 2000, 'pyramid entrance scene');
    Dialogue.skip(s);
    await until(() => game.scene.isActive('end'), 4000, 'ending card after pyramid fade');
    check(game.scene.isActive('end'), 'The spectral stag: walk back to the note then on to the ending card');
    // Restore the room scene for subsequent replays.
    game.scene.stop('end'); game.scene.start('room', { index: ROOMS.findIndex(([n]) => n === 'The spectral stag') });
    await until(() => game.scene.isActive('room') && room().player?.active, 5000, 'restore room after ending');

  }

  if (matches('The rehearsal')) {
    s = await cleanSolveRoom('The rehearsal');
    const relics = s.aimedBeams.filter((b) => b.room === s.index);
    relics.forEach((b) => b.clock = -100);
    await place(12, 2); await place(13, 4);
    s.player.body.reset(O().x + 3 * 32 + 16, O().y + 16 * 32 - 16);
    const lower = relics[1], beforeShot = stats.deaths;
    lower.clock = 0; s.updateAimedBeam(lower, 0.59); lower.clock = 0.61;
    key('keydown', 32); await wait(500); key('keyup', 32);
    lower.clock = -100;
    check(stats.deaths === beforeShot && s.corpses.length === 2, 'The rehearsal: bait low, then jump after lock to save the stair');
    for (const [x, top, to, height] of [[11, 0, 12, 3], [12, 3, 13, 5], [13, 5, 15, 7]]) {
      const r = await hop(x, top, 16, to);
      check(r.h >= height - 0.1, `The rehearsal: stair reaches ${height} (${r.h})`);
    }
    check(s.corpses.length === 2, 'The rehearsal: leading the beam below the stair preserves both steps');
    // Aim through the upper stair soul: the first soul absorbs the shot.
    const beam = relics[1], stair = s.corpses[1];
    beam.angle = Math.atan2(stair.y - beam.y, stair.x - beam.x);
    beam.clock = 0.99; beam.fired = false;
    s.updateAimedBeam(beam, 0.02); beam.clock = -100;
    check(s.corpses.length === 1 && !s.corpses.includes(stair), 'The rehearsal: a beam crossing the stair breaks its first soul');
    await place(24, 0, 9);
    s.player.body.reset(O().x + 20 * 32 + 16, O().y + 9 * 32 - 16);
    const corridor = relics[0], decoy = s.corpses.at(-1), deaths = stats.deaths;
    corridor.clock = 0; s.updateAimedBeam(corridor, 0.59);
    const angle = corridor.angle;
    corridor.clock = 0.61; s.updateAimedBeam(corridor, 0.1);
    check(corridor.angle === angle, 'The rehearsal: aiming locks for the final 0.4 seconds');
    corridor.clock = 0.99; s.updateAimedBeam(corridor, 0.02); corridor.clock = -100;
    check(!s.corpses.includes(decoy) && stats.deaths === deaths, 'The rehearsal: corridor decoy absorbs the shot without killing the player');
    key('keydown', 39);
    await until(() => s.index !== ROOMS.findIndex(([n]) => n === 'The rehearsal'), 4000);
    key('keyup', 39);
    check(s.rooms[s.index].name === 'The old tree', 'The rehearsal: run through the corridor after the decoy breaks');
  }
  await solve('Wrong order', [[4, 0]], []);
  if (matches('Wrong order')) {
    s = room();
    const leftHop = async (tx, top, toTx) => {
      s.player.body.reset(O().x + tx * 32 + 16, O().y + (16 - top) * 32 - 16);
      await wait(200);
      key('keydown', 32); key('keydown', 37);
      await until(() => s.player.x <= O().x + toTx * 32 + 20);
      key('keyup', 37); key('keydown', 39);
      await until(() => s.player.body.velocity.x >= 0);
      key('keyup', 39); await wait(900); key('keyup', 32); await wait(200);
      return 16 - (s.player.y + 15 - O().y) / 32;
    };
    const shelf = await leftHop(4, 1, 3);
    check(shelf >= 3.95, 'Wrong order: the temporary step reaches the first plate shelf');
    await place(2, 4);
    await place(10, 0);
    const doors = s.doors.filter((d) => d.room === s.index);
    const a = await hop(6.4, 0, 16, 10);
    const b = await hop(10, 1, 16, 15);
    check(a.h >= 0.95 && b.x >= 14.6 && s.start === s.shrines.find((sh) => O().contains(sh.x, sh.y))?.spawn,
      'Wrong order: replace the approach step with the bridge and reach the shrine');
    await place(22, 6);
    const launch = await hop(20, 0, 16, 22);
    const high = await leftHop(22, 7, 18);
    check(launch.h >= 6.95 && high >= 8.95,
      `Wrong order: temporary spring landing reaches the nine-high plate (${JSON.stringify({launch, high})})`);
    await place(17, 9);
    await place(24, 6);
    const shield = await hop(20, 0, 16, 24);
    const exit = await hop(24, 7, 16, 28.5);
    check(shield.h >= 6.95 && exit.x >= 28 && doors.every((d) => !d.body.enable),
      `Wrong order: replace the temporary landing with the laser shield and cross to the held exit (${JSON.stringify({shield, exit, doors: doors.map(d => d.body.enable), deaths: stats.deaths})})`);
    await place(21, 0);
    check(doors.every((d) => d.body.enable),
      'Wrong order: an extra death erases the high plate and shuts the exit');
    s = await cleanSolveRoom('Wrong order');
    await place(10, 0); await place(4, 0); await place(2, 4);
    const deaths = stats.deaths;
    await hop(6.4, 0, 16, 10);
    check(stats.deaths > deaths,
      'Wrong order: pit first loses the bridge on the third death');
  }
  if (matches('In my own way')) {
    s = await cleanSolveRoom('In my own way');
    const flat = async (tx) => {
      s.player.body.reset(O().x + tx * 32, O().y + 10 * 32 - 7);
      s.setLying(true); s.die(); await alive();
      check(s.corpses.at(-1).lying, 'In my own way: slide death leaves a flat bridge');
    };
    const recall = async () => {
      key('keydown', 81); await wait(60); key('keyup', 81); await wait(100);
    };
    const cross = async (from, to) => {
      s.player.body.reset(O().x + from * 32 + 16, O().y + 10 * 32 - 16);
      await wait(100);
      const deaths = stats.deaths;
      key('keydown', 39); await wait(180); key('keydown', 83); await wait(60); key('keyup', 83);
      for (let t = 0; t < 2500 && stats.deaths === deaths && s.player.x < O().x + to * 32; t += 10) await wait(10);
      key('keyup', 39); key('keydown', 37);
      for (let t = 0; t < 500 && s.player.body.velocity.x > 0; t += 10) await wait(10);
      key('keyup', 37); await wait(100);
      return stats.deaths === deaths && s.player.x >= O().x + to * 32;
    };
    // Stage A: preserve the bridge, remove only the plug, then jump to the shrine.
    await flat(5); await flat(7);
    await place(3, 0, 10);
    const bridge = s.corpses.slice(0, 2);
    check(!(await cross(1, 10)), 'In my own way: standing soul plugs the low tunnel');
    await recall();
    check(bridge.every((c) => s.corpses.includes(c)), 'In my own way: recall preserves both bridge souls');
    check(await cross(1, 10), 'In my own way: two flat souls cross stage A');
    const a = await hop(10, 0, 10, 11);
    check(a.h >= 0.95 && s.start.x > O().x + 10 * 32,
      `In my own way: real jump onto the shrine step (${a.x}, ${a.h}, spawn ${(s.start.x - O().x) / 32})`);
    // Stage B: the plate soul is oldest; recall the bad bridge before filling the third slot.
    key('keydown', 81); await wait(1200); key('keyup', 81); await wait(100);
    await place(16, 0, 10); await flat(21); await place(22, 0, 10);
    const plate = s.corpses[0], firstFlat = s.corpses[1];
    await recall(); await flat(23);
    check(s.corpses[0] === plate && s.corpses[1] === firstFlat,
      'In my own way: recalling the mistake keeps plate and first bridge');
    const b = await hop(14, 0, 10, 18);
    check(b.x >= 17.6 && b.h > -0.1, 'In my own way: jump over the plate soul reaches the slide approach');
    check(await cross(18, 27), 'In my own way: plate and two flat souls reach the open exit');
    await place(18, 0, 10);
    check(!s.corpses.includes(plate) && s.doors.filter((d) => d.room === s.index).every((d) => d.body.enable),
      'In my own way: careless fourth death erases the plate soul and closes the door');
    s = await cleanSolveRoom('In my own way');
    await flat(5);
    const deaths = stats.deaths;
    await hop(2, 0, 10, 10);
    check(stats.deaths > deaths, 'In my own way: one flat soul cannot bridge the first tunnel');
  }
  if (matches('Three jobs')) {
    s = await cleanSolveRoom('Three jobs');
    // Stage A: three separate jobs, then a real jump through the door to the shrine.
    for (const [x, b] of [[4, 0], [9, 0], [13, 2]]) await place(x, b, 8);
    const aDeaths = stats.deaths;
    for (const [x, top, to, height] of [[5, 0, 9, 1], [9, 1, 13, 0], [13, 0, 16, -7]]) {
      const r = await hop(x, top, 8, to);
      check(r.x >= to - 0.4 && r.h >= height - 0.1,
        `Three jobs: stage A jump reaches ${to} (${r.x}, ${r.h})`);
    }
    check(stats.deaths === aDeaths && s.start.x > O().x + 15 * 32, 'Three jobs: stage A reaches the shrine alive');
    key('keydown', 81); await wait(1200); key('keyup', 81); await wait(100);
    // Stage B: leave the plate oldest, bridge the spikes, block the beam above the crumbling landing.
    for (const [x, b] of [[18, 0], [23, 0], [17, 0]]) await place(x, b, 15);
    const plate = s.corpses[0], bridge = s.corpses[1];
    key('keydown', 81); await wait(60); key('keyup', 81); await wait(100);
    await place(27, 2, 15);
    check(s.corpses[0] === plate && s.corpses[1] === bridge,
      'Three jobs: recalling a mistake preserves the plate and bridge');
    const bDeaths = stats.deaths;
    for (const [x, top, to, height] of [[19, 0, 23, 1], [23, 1, 29, -1]]) {
      const r = await hop(x, top, 15, to);
      check(r.x >= to - 0.4 && r.h >= height - 0.1,
        `Three jobs: stage B jump reaches ${to} (${r.x}, ${r.h})`);
    }
    check(stats.deaths === bDeaths, 'Three jobs: crumbling lips crossed without another death');
    await place(17, 0, 15);
    check(!s.corpses.includes(plate) && s.doors.filter((d) => d.room === s.index).every((d) => d.body.enable),
      'Three jobs: fourth death erases the plate and shuts both doors');
    s = await cleanSolveRoom('Three jobs');
    await place(4, 0, 8); await place(13, 2, 8);
    const deaths = stats.deaths;
    await hop(5, 0, 8, 13);
    check(stats.deaths > deaths, 'Three jobs: plate and laser blocker cannot replace the pit bridge');
  }
  if (matches('Everything')) {
    s = await cleanSolveRoom('Everything');
    const run = async (from, to, slide = false) => {
      s.player.body.reset(O().x + from * 32 + 16, O().y + 20 * 32 - 16);
      await wait(100);
      const deaths = stats.deaths;
      key('keydown', 39); await wait(180);
      if (slide) { key('keydown', 83); await wait(60); key('keyup', 83); }
      for (let t = 0; t < 3000 && stats.deaths === deaths && s.player.x < O().x + to * 32; t += 10) await wait(10);
      key('keyup', 39); key('keydown', 37);
      for (let t = 0; t < 500 && s.player.body.velocity.x > 0; t += 10) await wait(10);
      key('keyup', 37); await alive();
      return stats.deaths === deaths && s.player.x >= O().x + to * 32;
    };
    const recall = async () => {
      key('keydown', 81); await wait(60); key('keyup', 81); await wait(100);
    };
    // A real slide death places the bridge; the next slide and jump reach the shrine.
    await run(4, 14, true);
    check(s.corpses.at(-1)?.lying, 'Everything: slide death leaves a flat tunnel bridge');
    check(await run(4, 14, true), 'Everything: slide crosses the bridge');
    const a = await hop(14, 0, 20, 16);
    check(a.h >= 0.95 && s.start.x > O().x + 15 * 32,
      'Everything: jump reaches the shrine');
    await recall();
    // All three slots have different jobs. Undo the bad spring step without a fourth death.
    await place(19, 0, 20); await place(25, 0, 20); await place(37, 0, 20);
    const plate = s.corpses[0], jam = s.corpses[1];
    await recall(); await place(37, 6, 20);
    check(s.corpses[0] === plate && s.corpses[1] === jam,
      'Everything: recall repairs the spring step without losing plate or saw jam');
    await wait(1000);
    check(s.saws.some((sw) => sw.room === s.index && sw.jam), 'Everything: second soul jams the tunnel saw');
    const deaths = stats.deaths;
    for (const [x, top, to, height] of [[17, 0, 21, 0], [21, 0, 22, 1], [24, 0, 25, 1], [25, 1, 31, 0]]) {
      const r = await hop(x, top, 20, to);
      check(r.x >= to - 0.4 && r.h >= height - 0.1,
        `Everything: plate and saw passage reaches ${to} (${r.x}, ${r.h})`);
    }
    // Launch from the spring, steer onto the hanging soul, then jump to the ledge.
    const launch = await hop(34, 0, 20, 37);
    check(launch.h >= 6.95 && launch.x >= 36.6,
      `Everything: spring lands on the hanging step (${launch.x}, ${launch.h})`);
    const exit = await hop(37, 7, 20, 41);
    check(exit.h >= 8.95 && exit.x >= 40.6 && stats.deaths === deaths,
      `Everything: spring step reaches the nine-high exit (${exit.x}, ${exit.h})`);
    await place(32, 0, 20);
    check(!s.corpses.includes(plate) && s.doors.filter((d) => d.room === s.index).every((d) => d.body.enable),
      'Everything: careless fourth death erases the plate and closes the door');
    s = await cleanSolveRoom('Everything');
    const before = stats.deaths;
    await hop(5, 0, 20, 11);
    check(stats.deaths > before, 'Everything: jumping cannot skip the empty tunnel bridge');
  }
  await solve('Three high', [[7, 2], [8, 3], [9, 4]],
    [[6, 0, 3, 7], [7, 3, 5, 9], [9, 5, 8, 12]]);
  if (matches('Three high')) {
    s = room();
    check(s.start.x > O().x + 10 * 32, 'Three high: safe staircase reaches the shrine');
    // New staircase: the last death in the beam makes both a step and a shield.
    for (const [tx, b] of [[24, 2], [25, 3], [26, 4]]) await place(tx, b);
    check(s.beams()[0].width < 32, 'Three high: highest step blocks the laser at its source');
    for (const [tx, top, to, height] of [[23, 0, 24, 3], [24, 3, 26, 5], [26, 5, 28, 8]]) {
      const r = await hop(tx, top, 16, to);
      check(r.h >= height - 0.05 && r.x >= to - 0.4,
        `Three high: laser staircase reaches ${height} up (got ${r.h}, column ${r.x})`);
    }
    const first = s.corpses[0];
    await place(17, 0);
    check(s.corpses.length === 3 && !s.corpses.includes(first),
      'Three high: careless fourth death erases the bottom step');
    const r = await hop(23, 0, 16, 25);
    check(r.h < 4, 'Three high: erased bottom step leaves the next step out of reach');
  }
  // ...and the same rooms can't be skipped: one soul short, the last jump falls short.
  await solve('The ladder', [[9, 2]], []);
  if (matches('The ladder')) { const r = await hop(9, 3, 16, 10); check(r.h < 7, `The ladder: a stack 3 high can't reach the ledge (${r.h})`); }
  await solve('Three high', [[8, 2], [9, 3]], []);
  if (matches('Three high')) { const r = await hop(9, 4, 16, 12); check(r.h < 8, `Three high: two souls can't reach the ledge (${r.h})`); }
  if (matches('The spring')) { // the spring alone falls short of its ledge
    const s = await cleanSolveRoom('The spring');
    s.player.body.reset(s.springs[0].x, s.springs[0].y - 20); key('keydown', 39); await wait(1600); key('keyup', 39); await wait(300);
    const h = 16 - (s.player.y + 15 - O().y) / 32;
    check(h < 9, `The spring: the spring alone can't reach the ledge (${h.toFixed(2)} up)`);
  }

  for (let i = 0; i < ROOMS.length; i++) { if (!matches(ROOMS[i][0])) continue; room().scene.restart({ index: i }); await wait(300); }
  check(errors.length === 0, 'no errors: ' + errors.join('; '));
  document.body.insertAdjacentHTML('beforeend', `<pre>RESULT ${fails.length ? 'FAIL ' + fails.join(' | ') : 'OK'}</pre>`);
})().catch((e) => document.body.insertAdjacentHTML('beforeend', `<pre>RESULT FAIL crashed: ${e.stack}</pre>`));
</script>
